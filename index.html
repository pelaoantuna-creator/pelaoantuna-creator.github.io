<!doctype html><html lang="es"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><meta name="apple-mobile-web-app-capable" content="yes">

<title>Educación Física Adaptada</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, minimum-scale=0.5, maximum-scale=5, user-scalable=yes">


<style>
/* Layout: mesa de juego (tapete verde) con tablero de oca clásico en espiral y marco de madera; marcador de turno, dado y posiciones como fichas de cartón al lado */
:root{
  --felt:#0b1d44; --felt-2:#06112b; --blue:#0098F3; --green:#009846; --yellow:#F7C929; --wood:#8a5428; --wood-2:#5b3518;
  --paper:#fbf1d7; --paper-2:#f2e0b4; --ink:#3a2416; --muted:#7a5d45; --cream:#fff8e6;
  --red:#c3312a; --gold:#F7C929; --sky:#5aa9d6; --grass:#4f9a3f;
  --ok:#009846; --warn:#d48a00; --bad:#c3312a;
  --f-display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:18px; --pop:0 5px 0 var(--ink);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--felt)}
body{color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(circle at 12% 18%,rgba(0,152,243,.38),transparent 42%),radial-gradient(circle at 88% 26%,rgba(247,201,41,.22),transparent 40%),radial-gradient(circle at 50% 105%,rgba(0,152,70,.42),transparent 55%),linear-gradient(180deg,var(--felt),var(--felt-2)) fixed var(--felt)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app{position:relative;z-index:1}
.app{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:1.6rem}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* cabecera */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px;color:var(--cream)}
.brand .logo{width:62px;height:62px;flex:none;background:var(--gold);border:3px solid var(--ink);border-radius:50%;box-shadow:var(--pop);padding:6px}
.brand h1{font-size:2.4rem;color:var(--gold);text-shadow:0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink)}
.brand p{margin:2px 0 0;color:#d8ecdf;font-size:.95rem}
.tools{display:flex;flex-wrap:wrap;gap:8px}

/* botones de juego */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:8px 18px;border-radius:14px;border:3px solid var(--ink);background:var(--paper);box-shadow:0 4px 0 var(--ink);font-family:var(--f-display);font-size:1.1rem;letter-spacing:.02em;cursor:pointer;color:var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.sm{min-height:44px;padding:5px 14px;font-size:1rem}
.btn.primary{background:var(--gold)}
.btn.big{min-height:66px;font-size:1.4rem;padding:10px 28px}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btn.help{background:var(--gold)}
.btn[aria-pressed="false"].tog{background:var(--paper-2);color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.armed{background:var(--red);color:#fff}
.btn.col{flex-direction:column;gap:2px;line-height:1.05}
.btn small{display:block;font-family:var(--f-body);font-weight:700;font-size:.85rem;letter-spacing:0}
.btn svg{width:28px;height:28px;flex:none}
.linkbtn{background:none;border:0;padding:0;color:inherit;text-decoration:underline;font-weight:700;cursor:pointer}

/* cartones */
.panel,.card{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--pop);padding:18px}
.panel{display:grid;gap:16px;align-content:start}
.note{margin:0;padding:10px 14px;border-radius:12px;background:var(--paper-2);font-size:.95rem}
.small{margin:0;color:var(--muted);font-size:.9rem}
.flabel{font-weight:700;font-size:.82rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.field{display:grid;gap:8px}

/* chips */
.lv{display:inline-grid;place-items:center;min-width:1.9em;height:1.9em;padding:0 .4em;font-family:var(--f-display);font-size:.95rem;border-radius:99px;border:2px solid var(--ink);line-height:1;color:#fff}
.lv-A{background:var(--ok)}.lv-B{background:#2c63c9}.lv-C{background:#7a3fc4}
.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:.95rem;padding:3px 12px;border-radius:99px;border:2px solid var(--ink);background:var(--cream)}
.tag svg{width:20px;height:20px}
.tag .av{--s:26px;border-width:2px;box-shadow:none;margin-left:-8px}
.nv{display:inline-grid;place-items:center;height:1.9em;padding:0 .55em;font-family:var(--f-display);font-size:.95rem;border-radius:99px;border:2px solid var(--ink);line-height:1;background:var(--gold);color:var(--ink)}
.chips{display:inline-flex;gap:4px;align-items:center}
.store{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:700;color:#d8ecdf;margin-top:4px}
.store i{width:10px;height:10px;border-radius:50%;background:var(--gold);border:2px solid var(--ink)}
.store.cloud i{background:#7ee08a}.store.local i{background:var(--red)}
.lvpick button svg{width:40px;height:40px;color:var(--ink)}
.lvpick.n3 button b{font-family:var(--f-display);font-weight:400;font-size:1.3rem}

/* avatar = ficha */
.av{--s:48px;display:inline-grid;place-items:center;width:var(--s);height:var(--s);border-radius:50%;overflow:hidden;border:3px solid var(--ring,#888);background:#fff;flex:none;box-shadow:0 0 0 2px var(--ink)}
.av svg,.av img{width:100%;height:100%;display:block;object-fit:cover}
.av.sm{--s:42px}.av.lg{--s:86px;border-width:4px}.av.xl{--s:128px;border-width:5px;box-shadow:0 0 0 3px var(--ink)}

/* ===== INICIO ===== */
.classbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.classbar .cb-l{font-family:var(--f-display);color:var(--cream);font-size:1.15rem;margin-right:4px}
.ctab{min-height:46px;padding:6px 16px;border-radius:99px;border:3px solid var(--ink);background:var(--paper-2);box-shadow:0 3px 0 var(--ink);font-family:var(--f-display);font-size:1.05rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.ctab.on{background:var(--gold)}
.ctab.add{background:transparent;color:var(--cream);border-style:dashed;border-color:var(--cream);box-shadow:none}
.ctab .live{width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid var(--ink)}
.setup{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media(min-width:960px){.setup{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}.setup .wide{grid-column:1/-1}}
.phead{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.phead .txt{flex:1 1 200px;font-family:var(--f-display);font-size:1.4rem}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.pcard button{width:100%;height:100%;display:grid;justify-items:center;gap:6px;padding:14px 8px;border-radius:14px;border:3px solid var(--ink);background:var(--cream);box-shadow:0 3px 0 var(--ink);cursor:pointer;text-align:center}
.pname{font-family:var(--f-display);font-size:1.2rem;line-height:1.1;overflow-wrap:anywhere}
.ex{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.pcard.add button{border-style:dashed;align-content:center;box-shadow:none;background:transparent}
.plus{display:grid;place-items:center;width:86px;height:86px;border-radius:50%;background:var(--paper-2);border:3px dashed var(--ink);font-family:var(--f-display);font-size:2.6rem}
.sub{font-size:.85rem;color:var(--muted)}
.choices{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.choice{display:grid;gap:4px;justify-items:center;text-align:center;padding:12px 8px;border-radius:14px;border:3px solid var(--ink);background:var(--cream);box-shadow:0 3px 0 var(--ink);cursor:pointer;line-height:1.15}
.choice b{font-family:var(--f-display);font-weight:400;font-size:1.25rem}
.choice span{font-size:.8rem;color:var(--muted)}
.choice svg{width:42px;height:42px}
.choice.on{background:var(--gold)}
.choice.on span{color:var(--ink)}
.switches,.actions{display:flex;flex-wrap:wrap;gap:10px}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.rules li{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:center;background:var(--cream);border:2px solid var(--ink);border-radius:14px;padding:10px}
.rules .ri{width:58px;height:58px;border-radius:12px;border:2px solid var(--ink);display:grid;place-items:center;padding:4px;background:var(--bg,#fff)}
.rules .ri svg{width:100%;height:100%}
.rules b{font-family:var(--f-display);font-weight:400;font-size:1.1rem;display:block;line-height:1.1}
.rules span{font-size:.88rem;color:var(--muted)}
.res{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.res i{font-style:normal;font-size:.78rem;font-weight:700;padding:1px 8px;border-radius:99px;color:#fff;border:1.5px solid var(--ink)}
.r-ok{background:var(--ok)}.r-help{background:var(--warn)}.r-bad{background:var(--bad)}

/* ===== JUEGO ===== */
.game{display:grid;gap:18px;grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "board" "rank"}
@media(min-width:1000px){.game{grid-template-columns:minmax(0,1fr) 330px;grid-template-areas:"board top" "board rank";align-items:start}}
.g-top{grid-area:top;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g-board{grid-area:board;min-width:0;display:grid;justify-items:center;gap:12px}
.g-rank{grid-area:rank}
.matchinfo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;grid-column:1/-1}
.matchinfo .cn{font-family:var(--f-display);font-size:1.3rem;color:var(--cream)}
.turn{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.turn .eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.turn .who{font-family:var(--f-display);font-size:2rem;line-height:1;overflow-wrap:anywhere}
.turn .where{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-weight:700}
.again{display:inline-block;background:var(--red);color:#fff;font-family:var(--f-display);padding:2px 10px;border-radius:99px;border:2px solid var(--ink);font-size:.95rem}
.dice-box{display:flex;align-items:center;gap:18px}
.die{--d:118px;width:var(--d);height:var(--d);flex:none;border-radius:24px;border:3px solid var(--ink);background:linear-gradient(145deg,#fffef8,#efe2c2);box-shadow:0 7px 0 var(--ink),inset 0 -7px 0 rgba(58,36,22,.08);cursor:pointer;padding:14px;transition:transform .1s}
.die:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.die:disabled{cursor:not-allowed;filter:grayscale(.4);opacity:.6}
.die:not(:disabled){animation:invite 1.8s ease-in-out infinite}
.die.rolling{animation:tumble .42s infinite}
.pips{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:100%;height:100%}
.pips i{display:block;width:70%;aspect-ratio:1;border-radius:50%;margin:auto}
.pips i.on{background:var(--ink);box-shadow:inset 0 2px 0 rgba(255,255,255,.25)}
.pips.one i.on{background:var(--red)}
.die-hint{margin:0;font-family:var(--f-display);font-size:1.4rem;line-height:1.1}
.die-hint small{display:block;font-family:var(--f-body);font-size:.85rem;color:var(--muted);margin-top:4px}
@keyframes tumble{0%{transform:rotate(0) translateY(0)}25%{transform:rotate(-16deg) translateY(-12px)}50%{transform:rotate(12deg) translateY(0)}75%{transform:rotate(-7deg) translateY(-6px)}}
@keyframes invite{50%{transform:translateY(-4px) rotate(-3deg)}}

/* tablero */
.frame{width:100%;max-width:min(100%,calc(100vh - 60px),860px);padding:12px;border-radius:24px;border:3px solid var(--ink);
  background:linear-gradient(135deg,#a3683a,var(--wood) 40%,var(--wood-2));box-shadow:0 8px 0 var(--ink),0 18px 40px rgba(0,0,0,.35)}
.board{--n:10;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));grid-template-rows:repeat(var(--n),minmax(0,1fr));aspect-ratio:1;gap:3px;padding:6px;border-radius:14px;border:2px solid var(--ink);
  background:var(--paper-2)}
.cell{position:relative;min-width:0;background:var(--paper);border:2px solid var(--ink);border-radius:7px;overflow:hidden;container-type:inline-size}
.cell:nth-child(odd){background:var(--cream)}
.cell .num{position:absolute;left:5cqi;top:2cqi;z-index:2;font-family:var(--f-display);font-size:max(9px,27cqi);line-height:1;color:var(--red);text-shadow:0 1px 0 #fff}
.cell .art{position:absolute;inset:14% 10% 8% 16%;display:grid;place-items:center}
.cell .art svg{width:100%;height:100%}
.cell .ico{inset:26% 18% 12% 22%;opacity:.9}
.cell.sp-oca{background:#f6cf4a!important}
.cell.sp-puente{background:#bfe2f3!important}
.cell.sp-posada{background:#f6b8a6!important}
.cell.sp-dados{background:#ffffff!important}
.cell.sp-laberinto{background:#c6e3a6!important}
.cell.salida{background:#cfe9c4!important}
.cell.salida .lab{position:absolute;left:0;right:0;bottom:4cqi;text-align:center;font-family:var(--f-display);font-size:max(8px,17cqi);z-index:2;color:var(--ink)}
.cell.salida .art{inset:6% 18% 26% 18%}
.cell .toks{position:absolute;left:3cqi;right:3cqi;bottom:3cqi;z-index:3;display:flex;flex-wrap:wrap-reverse;justify-content:center}
.cell .toks .av{--s:max(14px,44cqi);border-width:2px;box-shadow:0 0 0 1.5px var(--ink)}
.cell .toks .av+.av{margin-left:-14cqi}
.cell.here{box-shadow:inset 0 0 0 3px var(--red)}
.av.cur{animation:pulse 1.2s ease-in-out infinite;z-index:2}
.av.hop{animation:hop .28s ease-out}
@keyframes pulse{50%{transform:scale(1.12);box-shadow:0 0 0 3px var(--gold)}}
@keyframes hop{45%{transform:translateY(-40%) scale(1.25)}}
.garden{position:relative;min-width:0;border:3px solid var(--ink);border-radius:14px;overflow:hidden;container-type:inline-size;
  background:radial-gradient(circle at 50% 40%,#8fd16f 0,#5fae47 55%,#3f8a33 100%);display:grid;place-items:center;text-align:center;padding:6cqi}
.garden .gin{display:grid;justify-items:center;gap:2cqi}
.garden .gart{width:46cqi;max-width:220px}
.garden h3{font-size:max(11px,9cqi);color:var(--gold);text-shadow:0 2px 0 var(--ink),1px 0 0 var(--ink),-1px 0 0 var(--ink)}
.garden .gm{font-family:var(--f-display);font-size:max(10px,6cqi);color:#fff;background:var(--red);border:2px solid var(--ink);border-radius:99px;padding:.1em .8em}
.garden .toks{display:flex;flex-wrap:wrap;justify-content:center;gap:1cqi}
.garden .toks .av{--s:max(22px,13cqi)}
.flower{position:absolute;width:9cqi;height:9cqi}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.legend span{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--ink);border-radius:99px;padding:3px 12px 3px 4px;font-size:.88rem;font-weight:700}
.legend span>i{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
.legend svg{width:20px;height:20px}

.rank{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.rank li{display:grid;grid-template-columns:34px auto minmax(0,1fr);gap:10px;align-items:center;padding:8px 10px;border-radius:14px;background:var(--cream);border:2px solid var(--ink)}
.rank li.now{background:#fff3c4;box-shadow:inset 0 0 0 2px var(--gold)}
.rank .pl{font-family:var(--f-display);font-size:1.35rem;text-align:center}
.rank .nm{font-family:var(--f-display);font-size:1.15rem;line-height:1.05;overflow-wrap:anywhere}
.rank .sq{font-size:.85rem;color:var(--muted);font-weight:700}
.bar{height:9px;border-radius:9px;background:var(--paper-2);border:1.5px solid var(--ink);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--gold);transition:width .4s}
.rank li.done .bar i{background:var(--ok)}

/* ===== OVERLAYS ===== */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(18,30,22,.7);display:grid;place-items:center;padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));overflow:auto}
.sheet{width:min(840px,100%);max-height:100%;overflow:auto;background:var(--paper);border:4px solid var(--ink);border-radius:26px;box-shadow:0 10px 0 var(--ink),0 30px 60px rgba(0,0,0,.4);padding:20px;display:grid;gap:16px}
.carta-head{margin:-20px -20px 0;padding:14px 20px;background:var(--cc,var(--gold));border-bottom:4px solid var(--ink);display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:#fff}
.carta-head .tag{color:var(--ink)}
.carta-head .sqn{font-family:var(--f-display);font-size:1.5rem;text-shadow:0 2px 0 var(--ink)}
.reto-title{font-size:clamp(2rem,5.5vw,3rem)}
.reto-body{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
@media(min-width:620px){.reto-body{grid-template-columns:210px minmax(0,1fr)}}
.picto{aspect-ratio:1;width:100%;max-width:100%;border-radius:20px;background:#fff;border:4px solid var(--ink);box-shadow:inset 0 0 0 6px var(--cc,var(--gold));display:grid;place-items:center;color:var(--cc);padding:14%}
.picto img{width:100%;height:100%;object-fit:contain}
.picto svg{width:100%;height:100%}
@media(max-width:619px){.picto{width:170px;justify-self:center}}
.lvtabs{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.lvtabs button{min-height:46px;min-width:62px;border-radius:12px;border:3px solid var(--ink);background:var(--cream);font-family:var(--f-display);font-size:1.2rem;cursor:pointer}
.lvtabs button.on{background:var(--ink);color:var(--paper)}
.lvtabs button.mine{box-shadow:0 0 0 3px var(--gold)}
.lvtext{font-size:clamp(1.3rem,3.4vw,1.7rem);line-height:1.32;font-weight:700;margin:0}
.lvdesc{color:var(--muted);font-size:.92rem;margin:8px 0 0}
.meta-info{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.meta-info div{background:var(--cream);border:2px solid var(--ink);border-radius:12px;padding:10px 12px;font-size:.95rem}
.meta-info b{display:block;font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.reto-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.timer{flex:1 1 220px;display:flex;align-items:center;gap:8px}
.timer .tbar{flex:1;height:18px;border-radius:9px;background:var(--paper-2);border:2px solid var(--ink);overflow:hidden}
.timer .tbar i{display:block;height:100%;width:100%;background:var(--gold)}

.moment p{margin:0;font-weight:700;font-size:1.2rem}
.special .scene{justify-self:center}

.reroll{display:flex;flex-wrap:wrap;gap:10px;width:100%}
.reroll .btn{flex:1 1 200px;flex-direction:row;justify-content:flex-start;text-align:left;line-height:1.1;background:var(--cream)}
.reroll .btn small{display:block}
.sheet.flip{animation:flipc .45s ease-out}
@keyframes flipc{0%{transform:rotateY(80deg) scale(.95)}100%{transform:none}}
.overlay.intro{background:radial-gradient(circle at 50% 30%,rgba(0,152,243,.55),rgba(6,17,43,.92));align-items:start}
.introsheet{width:min(1000px,100%);gap:18px}
.ihead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ihead h2{flex:1 1 100%;font-size:clamp(2rem,5vw,3rem)}
.itit{color:var(--red);animation:drop .7s cubic-bezier(.3,1.6,.5,1) both}
.isub{font-size:1.5rem;margin:0}
.iplayers{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.icard{display:grid;justify-items:center;gap:6px;padding:14px 8px 12px;border-radius:20px;border:3px solid var(--ink);background:#fff;box-shadow:0 5px 0 var(--ink),inset 0 -40px 0 color-mix(in srgb,var(--ring) 22%,white);animation:cardin .7s cubic-bezier(.3,1.5,.5,1) var(--d) both}
.icard b{font-family:var(--f-display);font-weight:400;font-size:1.4rem;line-height:1.05;text-align:center;overflow-wrap:anywhere}
.icard .ipet .pet.big{--s:104px;animation:bob 1.2s ease-in-out calc(var(--d) + .7s) infinite}
@keyframes cardin{0%{opacity:0;transform:translateY(60px) scale(.6) rotate(-8deg)}100%{opacity:1;transform:none}}
.imat{display:grid;gap:12px;animation:fadeup .6s ease-out var(--d) both}
@keyframes fadeup{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:none}}
.imh{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.icount{font-family:var(--f-display);font-size:1.2rem;padding:4px 14px;border-radius:99px;border:3px solid var(--ink);background:var(--paper-2)}
.icount.all{background:var(--ok);color:#fff}
.igroup{display:grid;gap:6px}
.igroup .flabel{display:inline-flex;align-items:center;gap:6px}
.igroup .flabel svg{width:22px;height:22px;color:var(--ink)}
.itile{align-items:flex-start;min-height:62px}
.itile .mtx{display:grid;gap:4px}
.musers{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.mu{display:inline-block;width:26px;height:26px}
.mu svg{width:100%;height:100%}
.musers i{font-style:normal;font-size:.8rem;font-weight:700;color:var(--muted)}
.itile:not(.on){color:var(--ink)}
@media (prefers-reduced-motion: reduce){.icard,.imat,.itit{opacity:1}}
/* ================= ESTILO MODERNO DE JUEGO ================= */
body{background:radial-gradient(circle at 15% 10%,#3fa9ff 0,transparent 45%),radial-gradient(circle at 90% 20%,#8b5cf6 0,transparent 40%),radial-gradient(circle at 50% 110%,#22c55e 0,transparent 45%),linear-gradient(160deg,#1e5bd6,#3b2aa8 60%,#2a1d7a) fixed #2a3aa8}
/* botones con brillo */
.btn{border:0;border-radius:18px;background:linear-gradient(#ffffff,#e9eef9);color:#22305a;box-shadow:inset 0 -4px 0 rgba(34,48,90,.14),inset 0 2px 0 #fff,0 5px 0 #8f9cc0,0 9px 18px rgba(10,20,70,.28)}
.btn:active{transform:translateY(4px);box-shadow:inset 0 -2px 0 rgba(34,48,90,.14),0 1px 0 #8f9cc0}
.btn.primary,.btn.help{background:linear-gradient(#ffe773,#fbb81d);color:#5a3300;box-shadow:inset 0 -5px 0 rgba(160,80,0,.22),inset 0 3px 0 rgba(255,255,255,.65),0 5px 0 #c27800,0 10px 22px rgba(220,140,0,.4)}
.btn.ok{background:linear-gradient(#69e08a,#17a34a);color:#fff;text-shadow:0 2px 0 rgba(0,60,20,.35);box-shadow:inset 0 -5px 0 rgba(0,60,20,.25),inset 0 3px 0 rgba(255,255,255,.35),0 5px 0 #0b6b2f,0 10px 22px rgba(20,160,70,.4)}
.btn.bad,.btn.armed{background:linear-gradient(#ff9585,#e2453a);color:#fff;text-shadow:0 2px 0 rgba(100,0,0,.3);box-shadow:inset 0 -5px 0 rgba(100,0,0,.22),inset 0 3px 0 rgba(255,255,255,.35),0 5px 0 #9b2018,0 10px 22px rgba(220,60,40,.4)}
.btn[aria-pressed="false"].tog{background:linear-gradient(#eef1f7,#d6dcea);color:#6b7795}
.btn.mega{border:0;background:linear-gradient(#ffe773,#fbb81d);color:#5a3300;box-shadow:inset 0 -8px 0 rgba(160,80,0,.25),inset 0 4px 0 rgba(255,255,255,.7),0 9px 0 #c27800,0 0 0 10px rgba(255,231,115,.25),0 0 60px rgba(255,200,40,.6)}
.btn:disabled{filter:grayscale(.5)}
/* paneles suaves */
.panel,.card{border:0;border-radius:28px;background:linear-gradient(#fffdf8,#fff3db);box-shadow:0 8px 0 rgba(20,20,80,.18),0 20px 44px rgba(5,10,60,.35)}
.sheet:not(.special):not(.win){border:0;border-radius:32px;background:linear-gradient(#fffdf8,#fff1d3);box-shadow:0 10px 0 rgba(20,20,80,.2),0 30px 80px rgba(0,0,0,.45)}
.sheet.special,.sheet.win{border:0;border-radius:32px;box-shadow:0 10px 0 rgba(0,0,0,.2),0 30px 80px rgba(0,0,0,.45)}
.choice,.ctab:not(.add),.ccard:not(.add),.mtile,.pseg button,.seg button,.lvpick button,.petpick,.icard,.rcard,.cover li,.plist2 li,.rules li,.qadd,.adult,.meta-info div,.lvtabs button,.podium li,.pcard button,.wstep,.zoom,.hbtn,.tag,.picto,.txt,.dot,.legend span,.catchip{border-color:rgba(34,48,90,.16)!important;border-width:2px!important}
.choice,.ctab:not(.add),.ccard:not(.add),.mtile.on,.pseg button,.seg button,.lvpick button,.petpick,.icard,.rcard,.cover li,.plist2 li,.podium li,.pcard button,.wstep,.hbtn,.zoom{box-shadow:0 4px 0 rgba(34,48,90,.14),0 8px 18px rgba(34,48,90,.10)}
.choice.on,.ccard.on,.pseg button.on,.seg button.on,.lvpick button.on,.petpick.on,.ctab.on,.wstep.on{background:linear-gradient(#ffe773,#fbb81d)!important;box-shadow:0 0 0 3px #fff,0 0 0 6px #fbb81d,0 6px 14px rgba(200,120,0,.35)!important}
.cee{border:0;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.hbtn{background:linear-gradient(#fff,#eef2fb)}
.hbtn .hi{border:0;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.4)}
/* barra de juego con iconos */
.ibar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;justify-content:flex-end}
.ibtn{display:grid;justify-items:center;gap:3px;background:none;border:0;cursor:pointer;color:#fff;font-family:var(--f-display);font-size:.85rem;text-shadow:0 2px 0 rgba(0,0,0,.35);padding:0;min-width:58px}
.ibtn .ic{display:grid;place-items:center;width:54px;height:54px;border-radius:50%;background:linear-gradient(#ffffff,#dfe6f7);color:#22305a;padding:12px;box-shadow:inset 0 -4px 0 rgba(34,48,90,.15),0 4px 0 #8f9cc0,0 8px 16px rgba(0,0,0,.3);transition:transform .1s}
.ibtn .ic svg{width:100%;height:100%}
.ibtn:active .ic{transform:translateY(3px)}
.ibtn.y .ic{background:linear-gradient(#ffe773,#fbb81d);color:#5a3300;box-shadow:inset 0 -4px 0 rgba(160,80,0,.2),0 4px 0 #c27800,0 8px 16px rgba(0,0,0,.3)}
.ibtn.r .ic{background:linear-gradient(#ff9585,#e2453a);color:#fff;box-shadow:inset 0 -4px 0 rgba(100,0,0,.2),0 4px 0 #9b2018,0 8px 16px rgba(0,0,0,.3)}
.ibtn.off .ic{background:linear-gradient(#eef1f7,#c9d1e3);color:#8a94ad}
.ibtn:disabled{opacity:.45;cursor:not-allowed}
.ibtn:focus-visible{outline:none}.ibtn:focus-visible .ic{outline:4px solid var(--gold);outline-offset:3px}
body.ingame .hdrlogo{height:32px;background:rgba(255,255,255,.12);border-radius:10px;padding:3px 6px}
/* ===== TABLERO-MAPA ===== */
.frame{padding:clamp(10px,1.6vw,16px);border:0;border-radius:36px;background:radial-gradient(circle at 12px 12px,#69c25a 10px,transparent 11px) 0 0/24px 24px,linear-gradient(#4fae45,#2f8a33);box-shadow:inset 0 4px 0 rgba(255,255,255,.25),inset 0 -6px 0 rgba(0,0,0,.2),0 12px 0 rgba(10,40,10,.45),0 30px 60px rgba(0,0,0,.45)}
.corner{display:none}
.boardvp{border:0;border-radius:24px;box-shadow:inset 0 0 0 3px rgba(0,0,0,.08),inset 0 6px 20px rgba(0,0,0,.18)}
.board{display:block!important;position:relative;padding:0;gap:0;
  background:radial-gradient(circle at 18% 22%,rgba(255,255,255,.22) 0,transparent 30%),radial-gradient(circle at 78% 70%,rgba(255,255,255,.18) 0,transparent 32%),radial-gradient(circle,rgba(30,110,40,.13) 1.5px,transparent 2px) 0 0/22px 22px,linear-gradient(160deg,#9be07c,#6cc456 60%,#58b14a)!important}
.board .road{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.board .road .flow{animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-40}}
.cshadow{position:absolute;z-index:1;width:22%;aspect-ratio:2.2;border-radius:50%;background:rgba(10,60,20,.12);filter:blur(10px);pointer-events:none;animation:cloudmove 38s linear infinite}
.cshadow.s1{top:12%;left:-25%}.cshadow.s2{top:58%;left:-25%;animation-duration:52s;animation-delay:-20s;width:30%}
@keyframes cloudmove{to{left:110%}}
.deco{position:absolute;z-index:1;width:var(--w);margin-left:calc(var(--w) / -2);margin-top:calc(var(--w) / -2);pointer-events:none;transform-origin:50% 100%;animation:sway2 4s ease-in-out infinite}
.deco:nth-child(odd){animation-delay:-2s}
.deco svg{width:100%;height:auto;display:block}
@keyframes sway2{50%{transform:rotate(1.5deg)}}
.board .cell{position:absolute!important;width:var(--w);aspect-ratio:1;height:auto;margin-left:calc(var(--w) / -2);margin-top:calc(var(--w) / -2);border:0!important;border-radius:50%!important;overflow:visible!important;z-index:2;cursor:default;container-type:inline-size;
  background:radial-gradient(circle at 35% 28%,color-mix(in srgb,var(--kc,#fff) 45%,white),var(--kc,#fff) 62%,color-mix(in srgb,var(--kc,#fff) 82%,black))!important;
  box-shadow:0 0 0 4px #fff,0 7px 0 4px color-mix(in srgb,var(--kc,#ccc) 55%,#1a1a1a),0 12px 14px 2px rgba(0,40,0,.35)!important;animation:none}
.board .cell.salida{--kc:#51cf66}
.board .cell .num{left:-10%;top:-12%;width:38cqi;height:38cqi;background:#fff;border:0;color:#22305a;font-size:max(9px,21cqi);box-shadow:0 2px 0 rgba(0,0,0,.25);z-index:5}
.board .cell.norm .disc{position:absolute;inset:21%;width:auto;height:auto;right:auto;bottom:auto;background:none;border:0;box-shadow:none;padding:0;color:#fff;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.board .cell.norm .disc svg{width:100%;height:100%;stroke-width:4.4}
.board .cell .art{position:absolute;inset:13%!important;display:grid;place-items:center}
.board .cell.salida .art{inset:14% 18% 18% 18%!important}
.board .cell .lab{position:absolute;left:50%;bottom:-24%;transform:translateX(-50%);white-space:nowrap;background:linear-gradient(#ff6b5e,#d9362b);color:#fff;font-family:var(--f-display);font-size:max(8px,15cqi);letter-spacing:.04em;padding:2cqi 9cqi;border-radius:99px;box-shadow:0 2px 0 #8f1d15;text-shadow:0 1px 0 rgba(0,0,0,.3);z-index:6}
.board .cell.salida .lab{background:linear-gradient(#69db7c,#2f9e44);box-shadow:0 2px 0 #1b6b2c}
.board .cell .toks{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform:translateY(-36%);z-index:8;pointer-events:none}
.board .cell .toks .tok .pet{--s:max(30px,104cqi)}
.board .cell .toks.n2 .tok .pet{--s:max(26px,80cqi)}
.board .cell .toks.n3 .tok .pet,.board .cell .toks.n4 .tok .pet{--s:max(22px,62cqi)}
.board .cell .toks .tok.cur .pet{--s:max(34px,120cqi)}
.board .cell.here{z-index:7}
.board .cell.here::before{content:"";position:absolute;inset:-22%;border-radius:50%;border:max(3px,5cqi) solid #fff;box-shadow:0 0 18px 6px rgba(255,226,80,.9),inset 0 0 12px rgba(255,226,80,.8);animation:ring 1.4s ease-in-out infinite;pointer-events:none}
@keyframes ring{50%{transform:scale(1.1);opacity:.6}}
.board .cell.next{z-index:9}
.board .garden{position:absolute;z-index:3;margin:0;border:0;border-radius:40px;container-type:inline-size;
  background:radial-gradient(circle at 50% 45%,#c3f5a8,#8fdc6f 55%,#5fbf4b);box-shadow:0 0 0 8px rgba(255,255,255,.55),0 0 0 14px rgba(90,180,70,.6),0 12px 30px rgba(0,60,0,.35)}
.garden .fount{position:absolute;right:9%;bottom:16%;width:15%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#d0ebff 0 30%,#74c0fc 31% 60%,#adb5bd 61%);box-shadow:0 4px 0 #868e96}
.garden .pond{border:0;background:radial-gradient(ellipse,#a5d8ff,#4dabf7);opacity:.9}
.gtitle{border:0;background:linear-gradient(#ff6b5e,#d9362b);box-shadow:0 1.2cqi 0 #8f1d15,0 3cqi 6cqi rgba(0,0,0,.2)}
.gtitle svg{border:0}
.hub{border:0;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);box-shadow:0 2cqi 0 rgba(0,60,0,.18),0 4cqi 10cqi rgba(0,60,0,.25);border-radius:7cqi}
.garden .gm{border:0;background:linear-gradient(#ff6b5e,#d9362b);box-shadow:0 2px 0 #8f1d15}
/* dado 3D */
.die.die3d{background:none!important;border:0!important;box-shadow:none!important;padding:0!important;perspective:700px;animation:none}
.die.die3d:not(:disabled) .cube3d{animation:wiggle 1.8s ease-in-out infinite}
@keyframes wiggle{0%,100%{translate:0 0}50%{translate:0 -6%}}
.cube3d{position:relative;display:block;width:var(--d);height:var(--d);transform-style:preserve-3d;transition:transform .65s cubic-bezier(.2,1.4,.4,1)}
.cube3d .face{position:absolute;inset:0;display:grid;padding:14%;border-radius:22%;background:radial-gradient(circle at 30% 25%,#ffffff,#f1f3f8 60%,#dfe4ee);box-shadow:inset 0 0 0 2px rgba(34,48,90,.12),inset 0 -6px 10px rgba(34,48,90,.12);backface-visibility:hidden}
.cube3d .face .pips{width:100%;height:100%}
.cube3d .face .pips i.on{background:#22305a}
.cube3d .face .pips.one i.on{background:#e2453a}
.cube3d .f1{transform:translateZ(calc(var(--d) / 2))}.cube3d .f6{transform:rotateY(180deg) translateZ(calc(var(--d) / 2))}
.cube3d .f2{transform:rotateY(90deg) translateZ(calc(var(--d) / 2))}.cube3d .f5{transform:rotateY(-90deg) translateZ(calc(var(--d) / 2))}
.cube3d .f3{transform:rotateX(90deg) translateZ(calc(var(--d) / 2))}.cube3d .f4{transform:rotateX(-90deg) translateZ(calc(var(--d) / 2))}
.die.die3d.rolling .cube3d{animation:spin3d .55s linear infinite!important;transition:none}
@keyframes spin3d{from{transform:rotateX(0) rotateY(0) rotateZ(0)}to{transform:rotateX(360deg) rotateY(720deg) rotateZ(180deg)}}
.die.die3d.pop{animation:popd .5s ease-out}
.bigdie.die3d{--d:min(170px,40vw);width:auto;aspect-ratio:auto;border:0;background:none;box-shadow:none;padding:0;perspective:800px;animation:none;display:grid;place-items:center}
.bigdie.die3d .cube3d{animation:landin .9s cubic-bezier(.2,1.2,.4,1) both}
@keyframes landin{from{transform:translateY(-120px) rotateX(540deg) rotateY(360deg) scale(.4)}}
/* turno y carrera */
.rank li{border:0!important;background:linear-gradient(#ffffff,#f3f6fc);box-shadow:0 3px 0 rgba(34,48,90,.12),0 6px 14px rgba(34,48,90,.08);border-radius:18px}
.rank li.now{background:linear-gradient(#fff7cc,#ffe773);box-shadow:0 0 0 3px #fbb81d,0 6px 16px rgba(220,140,0,.35)!important}
.rank .pl{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(#ffe773,#fbb81d);color:#5a3300;font-size:1rem;box-shadow:0 2px 0 #c27800}
.rank li:nth-child(2) .pl{background:linear-gradient(#f1f3f5,#adb5bd);color:#343a40;box-shadow:0 2px 0 #6c757d}
.rank li:nth-child(3) .pl{background:linear-gradient(#ffc9a3,#e8590c);color:#fff;box-shadow:0 2px 0 #a3410a}
.rank li:nth-child(n+4) .pl{background:#e9ecf5;color:#6b7795;box-shadow:none}
.bar{height:12px;border:0!important;background:#e3e8f3;box-shadow:inset 0 2px 3px rgba(0,0,0,.12)}
.bar i{background:linear-gradient(90deg,#51cf66,#94d82d,#ffd43b);border-radius:9px;box-shadow:inset 0 2px 0 rgba(255,255,255,.5)}
.g-rank h2{color:#22305a}
.matchinfo .tag{background:#fff}
.legend span{background:rgba(255,255,255,.92);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.legend span>i{border:0;box-shadow:inset 0 0 0 2px rgba(34,48,90,.15)}
.stephud{border:0;box-shadow:0 6px 0 rgba(0,0,0,.18),0 10px 24px rgba(0,0,0,.3)}
.stepdots i{border:0!important;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12),0 2px 0 rgba(0,0,0,.2)}
.stepdots i.on{background:linear-gradient(#69e08a,#17a34a)}
/* tarjeta de reto */
.carta-head{border-bottom:0;background:linear-gradient(color-mix(in srgb,var(--cc) 80%,white),var(--cc));box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.picto{border:0;box-shadow:inset 0 0 0 6px var(--cc),0 6px 0 rgba(34,48,90,.15)}
.goal{box-shadow:0 5px 0 rgba(0,0,0,.25);background:linear-gradient(#2d3b6b,#1c264a);color:#ffe773}
.scene{border:0;box-shadow:0 8px 0 rgba(0,0,0,.18),0 14px 30px rgba(0,0,0,.25)}
.icard{border:0!important;box-shadow:0 6px 0 rgba(34,48,90,.15),0 12px 24px rgba(34,48,90,.15),inset 0 -40px 0 color-mix(in srgb,var(--ring) 22%,white)!important}

.board .cell.sp{z-index:3}.board .cell.occ{z-index:6}
.board .cell .lab{bottom:-14%!important;font-size:max(7px,13cqi)!important;padding:1cqi 7cqi!important}
.board .garden{box-shadow:0 0 0 5px rgba(255,255,255,.6),0 0 0 9px rgba(90,180,70,.55),0 10px 24px rgba(0,60,0,.3)}
html{background:#2a3aa8}
body{min-height:100vh}
@container (min-width:330px){.hub .hp{flex-direction:row!important;gap:2cqi}.hub .hn{text-align:left!important}.hub .hn b{font-size:max(14px,4.2cqi)!important}.pet.hubpet{--s:max(44px,10cqi)!important}.hub .die.die3d{--d:max(52px,11cqi)}.hub{padding:1.6cqi 3cqi!important;column-gap:3cqi!important}.gtitle{font-size:max(11px,3.6cqi)!important}.gtitle svg{width:max(18px,6cqi)!important;height:max(18px,6cqi)!important}}

.board .garden .gtitle svg{width:max(18px,9cqmin)!important;height:max(18px,9cqmin)!important}

.die.die3d:not(:disabled){animation:wiggle2 1.8s ease-in-out infinite}
@keyframes wiggle2{50%{transform:translateY(-6%) rotate(-4deg)}}
.cube25{position:relative;display:block;width:var(--d);height:var(--d);filter:drop-shadow(0 6px 6px rgba(20,30,70,.3))}
.cube25>span{position:absolute}
.cube25 .ctop{inset:0;background:linear-gradient(90deg,#ffffff,#eef1f7);clip-path:polygon(4% 20%,20% 3%,97% 3%,80% 20%)}
.cube25 .cside{inset:0;background:linear-gradient(#d8deea,#b9c2d6);clip-path:polygon(80% 20%,97% 3%,97% 80%,80% 97%)}
.cube25 .cfront{left:0;bottom:0;width:82%;height:82%;display:grid;padding:13%;border-radius:20%;background:radial-gradient(circle at 30% 25%,#ffffff,#f3f5fa 60%,#e3e8f2);box-shadow:inset 0 0 0 2px rgba(34,48,90,.1),inset 0 -5px 8px rgba(34,48,90,.12)}

const CURP={"ref": "Decreto 57/2022, de 5 de agosto, por el que se regula la ordenación y se establece el currículo de la Educación Primaria en el Principado de Asturias (Educación Física).", "CE": {"1": {"n": "Vida activa y saludable", "t": "Adoptar un estilo de vida activo y saludable, practicando regularmente actividades físicas, lúdicas y deportivas, adoptando comportamientos que potencien la salud física, mental y social, así como medidas de responsabilidad individual y colectiva durante la práctica motriz, para interiorizar e integrar hábitos de actividad física sistemática que contribuyan al bienestar.", "d": ["STEM2", "STEM5", "CPSAA2", "CPSAA5", "CE3"]}, "2": {"n": "Resolución de problemas motrices", "t": "Adaptar los elementos propios del esquema corporal, las capacidades físicas, perceptivo-motrices y coordinativas, así como las habilidades y destrezas motrices, aplicando procesos de percepción, decisión y ejecución adecuados a la lógica interna y a los objetivos de diferentes situaciones, para dar respuesta a las demandas de proyectos motores y de prácticas motrices con distintas finalidades en contextos de la vida diaria.", "d": ["STEM1", "CPSAA4", "CPSAA5"]}, "3": {"n": "Autorregulación e interacción", "t": "Desarrollar procesos de autorregulación e interacción en el marco de la práctica motriz, con actitud empática e inclusiva, haciendo uso de habilidades sociales y actitudes de cooperación, respeto, trabajo en equipo y deportividad, con independencia de las diferencias etnoculturales, sociales, de género y de habilidad de los participantes, para contribuir a la convivencia y al compromiso ético en los diferentes espacios en los que se participa.", "d": ["CCL1", "CCL5", "CPSAA1", "CPSAA3", "CPSAA5", "CC2", "CC3"]}, "4": {"n": "Cultura motriz y expresión", "t": "Reconocer y practicar diferentes manifestaciones lúdicas, físico-deportivas y artístico-expresivas propias de la cultura motriz, valorando su influencia y sus aportaciones estéticas y creativas a la cultura tradicional y contemporánea, para integrarlas en las situaciones motrices que se utilizan regularmente en la vida cotidiana.", "d": ["CC3", "CCEC1", "CCEC2", "CCEC3", "CCEC4"]}, "5": {"n": "Entorno natural y urbano", "t": "Valorar diferentes medios naturales y urbanos como contextos de práctica motriz, interactuando con ellos y comprendiendo la importancia de su conservación desde un enfoque sostenible, adoptando medidas de responsabilidad individual durante la práctica de juegos y actividades físico-deportivas, para realizar una práctica eficiente y respetuosa con el entorno y participar en su cuidado y mejora.", "d": ["STEM5", "CC2", "CC4", "CE1", "CE3"]}}, "CRIT": {"p1": {"1.1": "Identificar los desplazamientos activos como práctica saludable, conociendo sus beneficios físicos para el establecimiento de un estilo de vida activo.", "1.2": "Explorar las posibilidades de la propia motricidad a través del juego, aplicando en distintas situaciones cotidianas medidas básicas de cuidado de la salud personal a través de la higiene corporal y la educación postural.", "1.3": "Participar en juegos de activación y vuelta a la calma, reconociendo su utilidad para adaptar el cuerpo a la actividad física y evitar lesiones, manteniendo la calma y sabiendo cómo actuar en caso de que se produzca algún accidente en contextos de práctica motriz.", "1.4": "Conocer los valores positivos que fomenta la práctica motriz compartida, reconociendo, vivenciando y disfrutando sus beneficios en contextos variados e inclusivos y respetando a todos los participantes con independencia de sus diferencias individuales.", "2.1": "Reconocer la importancia de establecer metas claras a la hora de desarrollar proyectos motores de carácter individual, cooperativo o colaborativo, valorando su consecución a partir de un análisis de los resultados obtenidos.", "2.2": "Adoptar decisiones en contextos de práctica motriz de manera ajustada según las circunstancias.", "2.3": "Descubrir, reconocer y emplear los componentes cualitativos y cuantitativos de la motricidad de manera lúdica e integrada en diferentes situaciones y contextos, mejorando progresivamente su control y su dominio corporal.", "3.1": "Identificar las emociones que se producen durante el juego, intentando gestionarlas y disfrutando de la actividad física.", "3.2": "Respetar las normas consensuadas, así como las reglas de juego, y actuar desde los parámetros de la deportividad y el juego limpio, aceptando las características y niveles de los participantes.", "3.3": "Participar en las prácticas motrices cotidianas, comenzando a desarrollar habilidades sociales de acogida, inclusión, ayuda y cooperación, iniciándose en la resolución de conflictos personales de forma dialógica y justa, y mostrando un compromiso activo frente a las actuaciones contrarias a la convivencia.", "4.1": "Participar activamente en juegos y otras manifestaciones artístico-expresivas de carácter cultural propias del entorno, valorando su componente lúdico-festivo y disfrutando de su puesta en práctica.", "4.2": "Conocer y valorar los logros de distintos referentes del deporte de ambos géneros, reconociendo el esfuerzo, la dedicación y los sacrificios requeridos para alcanzar dichos éxitos.", "4.3": "Adecuar los distintos usos comunicativos de la corporalidad y sus manifestaciones a diferentes ritmos y contextos expresivos.", "5.1": "Participar en actividades lúdico-recreativas de forma segura en los entornos natural y urbano y en contextos terrestres o acuáticos, conociendo otros usos desde la motricidad y adoptando actitudes de respeto, cuidado y conservación de dichos entornos."}, "p2": {"1.1": "Reconocer la actividad física como alternativa de ocio saludable, identificando desplazamientos activos y sostenibles y conociendo los efectos beneficiosos a nivel físico y mental que posee adoptar un estilo de vida activo.", "1.2": "Aplicar medidas de educación postural, alimentación saludable, higiene corporal y preparación de la práctica motriz, asumiendo responsabilidades y generando hábitos y rutinas en situaciones cotidianas.", "1.3": "Tomar medidas de precaución y prevención de lesiones en relación con la conservación y el mantenimiento del material en el marco de distintas prácticas físico-deportivas, conociendo protocolos básicos de actuación ante accidentes que se puedan producir en este contexto.", "1.4": "Reconocer la propia imagen corporal y la de los demás, aceptando y respetando las diferencias individuales que puedan existir, superando y rechazando las conductas discriminatorias que se puedan producir en contextos de práctica motriz.", "2.1": "Llevar a cabo proyectos motores de carácter individual, cooperativo o colaborativo, empleando estrategias de monitorización y seguimiento que permitan analizar los resultados obtenidos.", "2.2": "Adoptar decisiones en situaciones lúdicas, juegos y actividades deportivas, ajustándose a las demandas derivadas de los objetivos motores, de las características del grupo y de la lógica interna de situaciones individuales, de cooperación, de oposición y de colaboración-oposición, en contextos simulados de actuación.", "2.3": "Emplear los componentes cualitativos y cuantitativos de la motricidad de manera eficiente y creativa en distintos contextos y situaciones motrices, adquiriendo un progresivo control y dominio corporal sobre ellos.", "3.1": "Mostrar una disposición positiva hacia la práctica física y hacia el esfuerzo, controlando la impulsividad y las emociones negativas que surjan en contextos de actividad motriz.", "3.2": "Respetar las normas consensuadas en clase, así como las reglas de juego, y actuar desde los parámetros de la deportividad y el juego limpio, valorando la aportación de quienes participan.", "3.3": "Desarrollar habilidades sociales de acogida, inclusión, ayuda y cooperación al participar en prácticas motrices variadas, resolviendo los conflictos individuales y colectivos de forma dialógica y justa, mostrando un compromiso activo frente a los estereotipos, las actuaciones discriminatorias y cualquier tipo de violencia.", "4.1": "Participar activamente en juegos motores y otras manifestaciones artístico-expresivas con arraigo en la cultura propia, tradicional o actual, así como otros procedentes de diversas culturas, contextualizando su origen, su aparición y su transmisión a lo largo del tiempo y valorando su importancia, repercusión e influencia en las sociedades pasadas y presentes.", "4.2": "Asumir una visión abierta del deporte a partir del conocimiento de distintas ligas femeninas, masculinas o mixtas, acercándose al deporte federado e identificando comportamientos contrarios a la convivencia independientemente del contexto en el que tengan lugar.", "4.3": "Reproducir distintas combinaciones de movimientos o coreografías individuales y grupales que incorporen prácticas comunicativas que transmitan sentimientos, emociones o ideas a través del cuerpo, empleando los distintos recursos expresivos y rítmicos de la corporalidad.", "5.1": "Desarrollar una práctica motriz segura en contextos naturales y urbanos de carácter terrestre o acuático, adecuando las acciones al análisis de cada situación y aplicando medidas de conservación ambiental."}, "p3": {"1.1": "Reconocer los efectos beneficiosos a nivel físico y mental de la actividad física como paso previo para su integración en la vida diaria.", "1.2": "Integrar los procesos de activación corporal, dosificación del esfuerzo, relajación e higiene en la práctica de actividades motrices, interiorizando las rutinas propias de una práctica motriz saludable y responsable.", "1.3": "Adoptar medidas de seguridad antes, durante y después de la práctica de actividad física, reconociendo los contextos de riesgo y actuando con precaución ante ellos.", "1.4": "Identificar y abordar conductas vinculadas al ámbito corporal, la actividad física y el deporte que resultan perjudiciales para la salud o afectan negativamente a la convivencia, adoptando posturas de rechazo a la violencia, a la discriminación y a los estereotipos de género, y evitando activamente su reproducción.", "2.1": "Desarrollar proyectos motores de carácter individual, cooperativo o colaborativo, definiendo metas, secuenciando acciones, introduciendo cambios, si es preciso, durante el proceso, y generando producciones motrices de calidad, valorando el grado de ajuste al proceso seguido y al resultado obtenido.", "2.2": "Aplicar principios básicos de toma de decisiones en situaciones lúdicas, juegos modificados y actividades deportivas a partir de la anticipación, ajustándolos a las demandas derivadas de los objetivos motores y a la lógica interna de situaciones individuales, de cooperación, de oposición y de colaboración-oposición, en contextos reales o simulados de actuación, reflexionando sobre las soluciones obtenidas.", "2.3": "Adquirir un progresivo control y dominio corporal, empleando los componentes cualitativos y cuantitativos de la motricidad de manera eficiente y creativa y haciendo frente a las demandas de resolución de problemas en situaciones motrices transferibles a su espacio vivencial.", "3.1": "Participar en actividades motrices, desde la autorregulación de su actuación, con predisposición, esfuerzo, perseverancia y mentalidad de crecimiento, controlando la impulsividad, gestionando las emociones y expresándolas de forma asertiva.", "3.2": "Respetar las normas consensuadas, así como las reglas de juego, y actuar desde los parámetros de la deportividad y el juego limpio, reconociendo las actuaciones de compañeros y rivales.", "3.3": "Convivir mostrando en el contexto de las prácticas motrices habilidades sociales, diálogo en la resolución de conflictos y respeto a la diversidad, ya sea de género, afectivo-sexual, de origen nacional, étnica, socio-económica o de competencia motriz, así como una actitud crítica y un compromiso activo frente a los estereotipos, las actuaciones discriminatorias y la violencia, haciendo especial hincapié en el fomento de la igualdad de género.", "4.1": "Participar activamente en juegos motores y otras manifestaciones artístico-expresivas con arraigo en la cultura propia, tradicional o actual, así como otros procedentes de diversas culturas, reconociendo y transmitiendo su valor cultural y su potencial como espacio generador de interacciones constructivas entre personas con orígenes diferentes y entendiendo las ventajas de su conservación.", "4.2": "Valorar el deporte como fenómeno cultural, analizando los estereotipos de género o capacidad y los comportamientos sexistas que a veces suceden en su contexto, rechazándolos y adoptando actitudes que eviten su reproducción en el futuro.", "4.3": "Reproducir y crear composiciones con o sin soporte musical, y comunicar diferentes sensaciones, emociones e ideas, de forma estética y creativa, desde el uso de los recursos rítmicos y expresivos de la motricidad.", "5.1": "Adaptar las acciones motrices a la incertidumbre propia del medio natural y urbano en contextos terrestres o acuáticos de forma eficiente y segura, valorando sus posibilidades para la práctica de actividad física y actuando desde una perspectiva ecosostenible del entorno y comunitaria."}}, "BLOQ": {"A": {"n": "Vida activa y saludable", "c": "#c0392b"}, "B": {"n": "Organización y gestión de la actividad física", "c": "#8a6a2f"}, "C": {"n": "Resolución de problemas en situaciones motrices", "c": "#2c63c9"}, "D": {"n": "Autorregulación emocional e interacción social en situaciones motrices", "c": "#b07a05"}, "E": {"n": "Manifestaciones de la cultura motriz", "c": "#a0308f"}, "F": {"n": "Interacción eficiente y sostenible con el entorno", "c": "#3f7f3a"}}, "SAB": {"A1": {"n": "Salud física", "p1": "Salud física: efectos físicos beneficiosos de un estilo de vida activo. Alimentación saludable e hidratación. Educación postural en situaciones cotidianas. Cuidado del cuerpo: higiene personal y el descanso tras la actividad física.", "p2": "Salud física: efectos físicos y psicológicos beneficiosos de un estilo de vida activo. Características de alimentos naturales, procesados y ultraprocesados. Educación postural en acciones motrices habituales. Factores básicos que inciden en el cuidado del cuerpo.", "p3": "Salud física: efectos físicos, psicológicos y sociales beneficiosos del estilo de vida activo. Impacto de alimentos ultraprocesados y bebidas energéticas o azucaradas. Educación postural en acciones motrices específicas. Responsabilidad personal en el cuidado del cuerpo."}, "A2": {"n": "Salud mental", "p1": "Salud mental: bienestar personal y en el entorno a través de la motricidad. Autoconocimiento e identificación de fortalezas y debilidades en todos los ámbitos (social, físico y mental).", "p2": "Salud mental: respeto y aceptación del propio cuerpo. Autoconocimiento e identificación de fortalezas, debilidades, posibilidades y limitaciones en todos los ámbitos (social, físico y mental).", "p3": "Salud mental: consolidación y ajuste realista del autoconcepto, teniendo en cuenta la perspectiva de género. Respeto y aceptación del propio cuerpo y del aspecto corporal de los demás."}, "A3": {"n": "Salud social", "p1": "Salud social: la actividad física como práctica social saludable. Derechos de los niños y niñas en el deporte escolar. Respeto a todas las personas con independencia de sus características personales.", "p2": "Salud social: la actividad física como hábito y alternativa saludable frente a formas de ocio nocivas. Límites para evitar una competitividad desmedida. Aceptación de distintas tipologías corporales, para practicar, en igualdad, diversidad de actividades físico-deportivas.", "p3": "Salud social: aproximación a los efectos de los malos hábitos relacionados con la salud e influencia en la práctica de actividad física. La exigencia del deporte profesional. Aceptación de distintas tipologías corporales, para practicar, en igualdad, diversidad de actividades físico-deportivas. Estereotipos corporales, de género y competencia motriz."}, "B1": {"n": "Elección de la práctica física", "p1": "Elección de la práctica física: vivencia de diversas experiencias corporales en distintos contextos evitando estereotipos de género.", "p2": "Elección de la práctica física: usos y finalidades catárticas, lúdico-recreativas y cooperativas. Respeto de las elecciones de los demás.", "p3": "Usos y finalidades: catárticos, lúdico-recreativos, competitivos y agonísticos."}, "B2": {"n": "Cuidado del material", "p1": "Cuidado del material utilizado en la actividad a desarrollar.", "p2": "Cuidado y preparación del material según la actividad a desarrollar.", "p3": "Actitudes consumistas en torno al equipamiento. Análisis de la adquisición de material para la práctica físico-deportiva."}, "B3": {"n": "Preparación e higiene", "p1": "Preparación de la práctica motriz: vestimenta deportiva y hábitos generales de higiene corporal.", "p2": "Pautas de higiene personal relacionadas con la actividad física.", "p3": "Hábitos autónomos de higiene corporal en acciones cotidianas."}, "B4": {"n": "Proyectos motores y metas", "p1": "Planificación y autorregulación de proyectos motores sencillos: objetivos o metas.", "p2": "Planificación y autorregulación de proyectos motores: mecanismos básicos para ejecutar lo planificado.", "p3": "Planificación y autorregulación de proyectos motores: seguimiento y valoración durante el proceso y del resultado."}, "B5": {"n": "Prevención: activación y calma", "p1": "Prevención de accidentes en las prácticas motrices: juegos de activación, calentamiento y vuelta a la calma.", "p2": "Prevención de accidentes en las prácticas motrices: mecanismos de prevención y control corporal para la prevención de lesiones.", "p3": "Prevención de accidentes en las prácticas motrices: calentamiento general y vuelta a la calma. Importancia de respetar las normas de seguridad. Compromiso de responsabilidad hacia la seguridad propia y de los demás."}, "B6": {"n": "Actuación ante accidentes", "p1": "", "p2": "", "p3": "Actuaciones básicas ante accidentes durante la práctica de actividades físicas. Posición lateral de seguridad. Conducta PAS (proteger, avisar, socorrer)."}, "C1": {"n": "Toma de decisiones", "p1": "Toma de decisiones: adecuación de las acciones a las capacidades y las limitaciones personales en situaciones motrices individuales. Coordinación de acciones con compañeros en situaciones cooperativas. Adecuación de la acción a la ubicación del adversario en situaciones motrices de persecución y de interacción con un móvil. Selección de la posición corporal o la distancia adecuadas en situaciones de oposición de contacto. Selección de acciones para mantener la posesión, recuperar el móvil o evitar que el atacante progrese en situaciones motrices de colaboración-oposición de persecución y de interacción con un móvil.", "p2": "Toma de decisiones: distribución racional del esfuerzo en situaciones motrices individuales. Ubicación en el espacio en situaciones cooperativas. Ubicación en el espacio y reubicación tras cada acción en situaciones motrices de persecución y de interacción con un móvil. Anticipación a las decisiones ofensivas del adversario en situaciones de oposición de contacto. Pase a compañeros desmarcados o en situación ventajosa en situaciones motrices de colaboración-oposición de persecución y de interacción con un móvil.", "p3": "Toma de decisiones: selección de acciones en función del entorno en situaciones motrices individuales. Selección de acciones para el ajuste espacio-temporal en la interacción con los compañeros en situaciones cooperativas. Selección de zonas de envío del móvil desde donde sea difícil devolverlo en situaciones motrices de persecución y de interacción con un móvil. Selección adecuada de las habilidades motrices en situaciones de oposición de contacto. Desmarque y ubicación en un lugar desde el que se constituya un apoyo para los demás en situaciones motrices de colaboración-oposición de persecución y de interacción con un móvil."}, "C2": {"n": "Capacidades perceptivo-motrices", "p1": "Capacidades perceptivo-motrices en contexto de práctica: integración del esquema corporal; conciencia corporal; lateralidad y su proyección en el espacio; coordinación óculo-pédica y óculo-manual; equilibrio estático y dinámico.", "p2": "Capacidades perceptivo-motrices en contexto de práctica: integración del esquema corporal, control tónico-postural e independencia segmentaria en situaciones motrices. Definición de la lateralidad. Coordinación dinámica general y segmentaria.", "p3": "Capacidades perceptivo-motrices en contexto de práctica: integración del esquema corporal; equilibrio estático y dinámico en situaciones de complejidad creciente; organización espacial (percepción de distancias y trayectoria, orientación en el espacio), temporal (simultaneidad y sucesión de acciones) y espacio-temporal (ritmo, ajuste perceptivo en el envío y en la interceptación de trayectorias de móviles)."}, "C3": {"n": "Capacidades físicas", "p1": "Capacidades físicas desde el ámbito lúdico y el juego.", "p2": "Capacidades condicionales: capacidades físicas básicas.", "p3": "Capacidades condicionales: capacidades físicas básicas y resultantes (coordinación, equilibrio y agilidad)."}, "C4": {"n": "Habilidades motrices", "p1": "Habilidades y destrezas motrices básicas genéricas: locomotrices, no locomotrices y manipulativas.", "p2": "Habilidades y destrezas motrices básicas genéricas: locomotrices, no locomotrices y manipulativas. Combinación de habilidades.", "p3": "Iniciación de las habilidades motrices específicas asociadas a la técnica en actividades físico-deportivas: aspectos principales."}, "C5": {"n": "Creatividad motriz", "p1": "Creatividad motriz: variación y adecuación de la acción motriz ante estímulos internos.", "p2": "Creatividad motriz: variación y adecuación de la acción motriz ante estímulos internos y externos.", "p3": "Creatividad motriz: identificación de estímulos internos o externos que exijan un reajuste instantáneo de la acción motriz."}, "D1": {"n": "Gestión emocional", "p1": "Gestión emocional: estrategias de identificación, experimentación y manifestación de emociones, pensamientos y sentimientos a partir de experiencias motrices.", "p2": "Gestión emocional: reconocimiento de emociones propias, pensamientos y sentimientos a partir de experiencias motrices.", "p3": "Gestión emocional: ansiedad y situaciones motrices. Estrategias de afrontamiento y gestión."}, "D2": {"n": "Habilidades sociales", "p1": "Habilidades sociales: verbalización de emociones derivadas de la interacción en contextos motrices.", "p2": "Habilidades sociales: escucha activa y estrategias de negociación para la resolución de conflictos en contextos motrices.", "p3": "Habilidades sociales: estrategias de trabajo en equipo para la resolución constructiva de conflictos en situaciones motrices colectivas."}, "D3": {"n": "Reglas y deportividad", "p1": "Respeto a las reglas de juego.", "p2": "Concepto de deportividad.", "p3": "Concepto de fairplay o juego limpio."}, "D4": {"n": "Convivencia e igualdad", "p1": "Conductas que favorezcan la convivencia y la igualdad de género, inclusivas y de respeto a los demás, en situaciones motrices: estrategias de identificación de conductas discriminatorias o contrarias a la convivencia.", "p2": "Conductas contrarias a la convivencia en situaciones motrices (discriminación por cuestiones de competencia motriz, etnia, género u otras): efectos negativos y estrategias de identificación, abordaje y evitación.", "p3": "Identificación, abordaje y rechazo de conductas violentas o contrarias a la convivencia en situaciones motrices (discriminación por cuestiones de género, capacidad o competencia motriz; actitudes xenófobas, racistas o de índole sexista; abuso sexual o cualquier forma de violencia)."}, "E1": {"n": "Juegos y danzas: herencia cultural", "p1": "Aportaciones de la cultura motriz a la herencia cultural. Los juegos y las danzas como manifestación de la propia cultura.", "p2": "Aportaciones de la cultura motriz a la herencia cultural. Los juegos y las danzas como manifestación de la interculturalidad.", "p3": "Aportaciones de la cultura motriz a la herencia cultural. Los deportes como seña de identidad cultural."}, "E2": {"n": "Usos comunicativos del cuerpo", "p1": "Usos comunicativos de la corporalidad: gestos, muecas, posturas y otros.", "p2": "Usos comunicativos de la corporalidad: comunicación de sensaciones, sentimientos, emociones e ideas simples.", "p3": "Usos comunicativos de la corporalidad: comunicación de sensaciones, sentimientos, emociones e ideas complejas."}, "E3": {"n": "Actividades rítmico-musicales", "p1": "Práctica de actividades rítmico-musicales con carácter artístico-expresivo.", "p2": "Práctica de actividades rítmico-musicales con carácter expresivo.", "p3": "Práctica de actividades rítmico-musicales con carácter expresivo."}, "E4": {"n": "Deporte y perspectiva de género", "p1": "Deporte y perspectiva de género: referentes en el deporte de distintos géneros.", "p2": "Deporte y perspectiva de género: ligas masculinas, femeninas y mixtas de distintos deportes. Referentes masculinos y femeninos.", "p3": "Deporte y perspectiva de género: sexismo en el deporte amateur y profesional."}, "E5": {"n": "Deporte olímpico y paralímpico", "p1": "", "p2": "", "p3": "Deportes olímpicos y paralímpicos, historia e instituciones asociadas a los Juegos Olímpicos y Paralímpicos. Visibilización de los logros de las mujeres."}, "F1": {"n": "Educación vial", "p1": "Normas de uso: educación vial para peatones. Movilidad segura, saludable y sostenible.", "p2": "Normas de uso: educación vial para bicicletas. Movilidad segura, saludable y sostenible.", "p3": "Normas de uso: la educación vial desde la actividad física y deportiva. Movilidad segura, saludable y sostenible."}, "F2": {"n": "Espacios de juego", "p1": "Posibilidades motrices de los espacios de juego y esparcimiento infantil.", "p2": "Espacios naturales en el contexto urbano: uso, disfrute seguro y mantenimiento.", "p3": "Transporte activo, seguro y sostenible: bicicletas, patines, patinetes."}, "F3": {"n": "El material y su uso", "p1": "El material y sus posibilidades de uso para el desarrollo de la motricidad.", "p2": "Estado del material para actividades en el medio natural y urbano: valoración previa y actuación ante desperfectos.", "p3": "Previsión de riesgos de accidente durante la práctica en el medio natural y urbano: valoración previa y actuación."}, "F4": {"n": "Residuos y consumo responsable", "p1": "", "p2": "Prevención y sensibilización sobre la generación de residuos y su correcta gestión.", "p3": "Consumo responsable: construcción y reutilización de materiales para la práctica motriz."}, "F5": {"n": "Actividad en el medio natural y urbano", "p1": "Realización de actividades físicas seguras en el medio natural y urbano.", "p2": "Realización de actividades físicas seguras en el medio natural y urbano.", "p3": "Práctica de actividades físicas en el medio natural y urbano."}, "F6": {"n": "Cuidado del entorno", "p1": "Cuidado del entorno próximo y de los animales y plantas que en él conviven, como servicio a la comunidad, durante la práctica segura de actividades físicas en el medio natural y urbano.", "p2": "Cuidado del entorno próximo y de los animales y plantas que en él conviven, como servicio a la comunidad, durante la práctica segura de actividades físicas en el medio natural y urbano.", "p3": "Cuidado del entorno próximo y de los animales y plantas que en él conviven, como servicio a la comunidad, durante la práctica de actividad física en el medio natural y urbano."}}, "DESC": {"CCL1": "Expresa hechos, conceptos, pensamientos, opiniones o sentimientos de forma oral, escrita, signada o multimodal, con claridad y adecuación a diferentes contextos cotidianos de su entorno personal, social y educativo, y participa en interacciones comunicativas con actitud cooperativa y respetuosa, tanto para intercambiar información y crear conocimiento como para construir vínculos personales.", "CCL5": "Pone sus prácticas comunicativas al servicio de la convivencia democrática, la gestión dialogada de los conflictos y la igualdad de derechos de todas las personas, detectando los usos discriminatorios, así como los abusos de poder, para favorecer la utilización no solo eficaz sino también ética de los diferentes sistemas de comunicación.", "STEM1": "Utiliza, de manera guiada, algunos métodos inductivos y deductivos propios del razonamiento matemático en situaciones conocidas, y selecciona y emplea algunas estrategias para resolver problemas reflexionando sobre las soluciones obtenidas.", "STEM2": "Utiliza el pensamiento científico para entender y explicar algunos de los fenómenos que ocurren a su alrededor, confiando en el conocimiento como motor de desarrollo, utilizando herramientas e instrumentos adecuados, planteándose preguntas y realizando experimentos sencillos de forma guiada.", "STEM5": "Participa en acciones fundamentadas científicamente para promover la salud y preservar el medio ambiente y los seres vivos, aplicando principios de ética y seguridad y practicando el consumo responsable.", "CPSAA1": "Es consciente de las propias emociones, ideas y comportamientos personales y emplea estrategias para gestionarlas en situaciones de tensión o conflicto, adaptándose a los cambios y armonizándolos para alcanzar sus propios objetivos.", "CPSAA2": "Conoce los riesgos más relevantes y los principales activos para la salud, adopta estilos de vida saludables para su bienestar físico y mental, y detecta y busca apoyo ante situaciones violentas o discriminatorias.", "CPSAA3": "Reconoce y respeta las emociones y experiencias de las demás personas, participa activamente en el trabajo en grupo, asume las responsabilidades individuales asignadas y emplea estrategias cooperativas dirigidas a la consecución de objetivos compartidos.", "CPSAA4": "Reconoce el valor del esfuerzo y la dedicación personal para la mejora de su aprendizaje y adopta posturas críticas en procesos de reflexión guiados.", "CPSAA5": "Planea objetivos a corto plazo, utiliza estrategias de aprendizaje autorregulado y participa en procesos de auto y coevaluación, reconociendo sus limitaciones y sabiendo buscar ayuda en el proceso de construcción del conocimiento.", "CC2": "Participa en actividades comunitarias, en la toma de decisiones y en la resolución de los conflictos de forma dialogada y respetuosa con los procedimientos democráticos, los principios y valores de la Unión Europea y la Constitución española, los derechos humanos y de la infancia, el valor de la diversidad, y el logro de la igualdad de género, la cohesión social y los Objetivos de Desarrollo Sostenible.", "CC3": "Reflexiona y dialoga sobre valores y problemas éticos de actualidad, comprendiendo la necesidad de respetar diferentes culturas y creencias, de cuidar el entorno, de rechazar prejuicios y estereotipos, y de oponerse a cualquier forma de discriminación o violencia.", "CC4": "Comprende las relaciones sistémicas entre las acciones humanas y el entorno, y se inicia en la adopción de estilos de vida sostenibles, para contribuir a la conservación de la biodiversidad desde una perspectiva tanto local como global.", "CE1": "Reconoce necesidades y retos que afrontar y elabora ideas originales, utilizando destrezas creativas y tomando conciencia de las consecuencias y efectos que las ideas pudieran generar en el entorno, para proponer soluciones valiosas que respondan a las necesidades detectadas.", "CE3": "Crea ideas y soluciones originales, planifica tareas, coopera con otros en equipo, valorando el proceso realizado y el resultado obtenido, para llevar a cabo una iniciativa emprendedora, considerando la experiencia como una oportunidad para aprender.", "CCEC1": "Reconoce y aprecia los aspectos fundamentales del patrimonio cultural y artístico, comprendiendo las diferencias entre distintas culturas y la necesidad de respetarlas.", "CCEC2": "Reconoce y se interesa por las especificidades e intencionalidades de las manifestaciones artísticas y culturales más destacadas del patrimonio, identificando los medios y soportes, así como los lenguajes y elementos técnicos que las caracterizan.", "CCEC3": "Expresa ideas, opiniones, sentimientos y emociones de forma creativa y con una actitud abierta e inclusiva, empleando distintos lenguajes artísticos y culturales, integrando su propio cuerpo, interactuando con el entorno y desarrollando sus capacidades afectivas.", "CCEC4": "Experimenta de forma creativa con diferentes medios y soportes, y diversas técnicas plásticas, visuales, audiovisuales, sonoras o corporales, para elaborar propuestas artísticas y culturales."}};

2:[
 ['sal','Calentamos','Haz el calentamiento: 10 rodillas arriba, 10 círculos de brazos y 5 sentadillas.','3 ejercicios','Agarrado a la espaldera, haz 10 elevaciones de rodilla y 10 círculos de brazos.','2 ejercicios','Haz 10 círculos de brazos y 10 giros de muñecas.','2 ejercicios','Espaldera.','Explica para qué: «calentamos para no hacernos daño». En C, ajusta al rango de movimiento.',';espaldera;','1|B3|1.3'],

 ['emo','Semáforo de la calma','Recorre el semáforo: para (rojo), respira 3 veces (amarillo) y sigue (verde).','1 semáforo','Con el adulto, recorre el semáforo: para, respira 3 veces y sigue.','1 semáforo','Mira cada color del semáforo mientras respiras con el adulto.','3 respiraciones','Semáforo de la calma.','Estrategia de autorregulación para cualquier momento. Practícala en calma para que funcione cuando haga falta.','semaforo','3|D1|3.1'],
 ['emo','Adivina la emoción','Pon con la cara y el cuerpo la emoción que sale; el profe la adivina.','2 emociones','Pon con la cara y los brazos la emoción que sale.','2 emociones','Elige el pictograma de la emoción que ves en la cara del adulto.','2 emociones','Pictogramas de emociones.','Emociones básicas: alegría, tristeza, enfado y miedo. En C, dos opciones cada vez.','emociones','3,4|D1,E2|3.1,4.3'],
 ['emo','Gano o pierdo, sonrío','Tira el dado contra el profe: gana el número más alto. Ganes o pierdas, choca la mano y di «¡bien jugado!».','3 rondas','Tira el dado contra el profe. Ganes o pierdas, choca la mano.','3 rondas','Empuja o suelta el dado contra el profe. Ganes o pierdas, sonríe o choca la mano.','2 rondas','Dado grande.','Tolerancia a la frustración: anticipa antes de empezar que se puede perder.','dadogrande','3|D1,D3|3.1,3.2'],

 ['int','¡Ánimo, compañero!','Anima a un compañero mientras hace su reto: aplaude y di su nombre.','3 ánimos','Anima a un compañero: aplaude y di su nombre.','3 ánimos','Anima a un compañero con aplausos, una sonrisa o tu comunicador.','2 ánimos','Ninguno.','El reto es animar: el compañero hace cualquier tarea sencilla mientras tanto.','','3,1|D2,A3|3.3,1.4'],

 ['ent','Paso de cebra','Cruza el paso de cebra cuando el semáforo esté en verde y para en rojo.','3 cruces','Cruza el paso de cebra con apoyo cuando el semáforo esté en verde.','2 cruces','Cruza el paso de cebra con la silla al ver el verde; si te llevan, di tú «¡ya!».','2 cruces','Cinta para el paso de cebra, semáforo de cartón.','Educación vial como peatón. Pinta el paso de cebra con cinta.','cinta,semaforo','5|F1|5.1'],

3:[
 ['sal','Dirijo el calentamiento','Dirige al grupo 3 ejercicios de calentamiento, contando hasta 8 en cada uno.','3 ejercicios','Dirige al grupo 2 ejercicios de calentamiento con los pictogramas.','2 ejercicios','Elige con los pictogramas 2 ejercicios de calentamiento y el grupo los hace contigo.','2 ejercicios','Pictogramas de calentamiento.','Es el protagonista: el grupo le sigue. Revisa que los ejercicios sean seguros para todos.','pictos','1,3|B3,D2|1.3,3.3'],

 ['emo','Termómetro de emociones','Marca en el termómetro cómo estás, haz 10 sentadillas rápidas y vuelve a marcar: ¿ha cambiado?','2 marcas','Marca cómo estás, haz 10 elevaciones de rodilla con apoyo y vuelve a marcar.','2 marcas','Elige entre dos pictogramas cómo estás, mueve los brazos rápido 20 segundos y vuelve a elegir.','2 marcas','Termómetro de emociones con pictogramas.','Compara el antes y el después. Si la emoción sube, ofrece una estrategia de calma.','emociones','3|D1,A2|3.1'],

 ['emo','Pido ayuda','En el circuito, pide ayuda con la palabra o el pictograma cuando la necesites para subir el step.','1 vez','Pide ayuda con la palabra o el pictograma para pasar el obstáculo.','1 vez','Pide ayuda con tu comunicador o pulsador para alcanzar la pelota que está lejos.','1 vez','Pictograma de ayuda, step.','Crea la necesidad (obstáculo u objeto fuera de alcance) y espera la petición. Pedir ayuda se aprende.','pictos,step;pictos,step;pictos,pelota','3|D1,D2|3.1,3.3'],
 ['int','Juego limpio','Juega una partida de bolos por turnos con un compañero y, al terminar, dale la mano.','1 partida','Juega con apoyo una partida de bolos por turnos y, al terminar, dale la mano al compañero.','1 partida','Juega por turnos con la rampa y, al terminar, choca la mano o sonríe al compañero.','1 partida','Bolos, pelota, rampa.','Valora tres cosas: respeta el turno, acepta el resultado y felicita.','bolos,pelota;bolos,pelota;bolos,pelota,rampa','3|D3|3.2'],

 ['int','Árbitro por un día','Haz de árbitro: levanta la tarjeta verde si el compañero respeta su turno y la roja si no.','3 decisiones','Haz de árbitro con apoyo: tarjeta verde si respeta el turno, roja si no.','3 decisiones','Haz de árbitro: señala o mira la tarjeta verde o la roja.','2 decisiones','Tarjetas verde y roja.','Reconocer la norma en otro ayuda a cumplirla. El compañero lo hace bien y mal a propósito.','pictos','3|D3|3.2'],
 ['exp','Mi coreografía','Inventa y baila una secuencia de 4 movimientos con la música.','4 movimientos','Inventa y baila con apoyo una secuencia de 3 movimientos.','3 movimientos','Elige con pictogramas 3 movimientos (brazos, cabeza, aplauso) y hazlos con la música.','3 movimientos','Música, pictogramas de movimientos.','Creatividad motriz: el alumno decide el orden. Que la repita dos veces igual.','musica;musica;musica,pictos','4,2|E2,C4|4.3,2.3'],
 ['exp','Mimo del deporte','Representa sin hablar un deporte (nadar, chutar, encestar) y que lo adivinen.','2 deportes','Representa con los brazos un deporte y que lo adivinen.','2 deportes','Representa con los brazos o la cabeza el deporte del pictograma.','1 deporte','Pictogramas de deportes.','Mímica: sin palabras. Ofrece pictogramas de apoyo a quien adivina.','pictos','4|E2,E3|4.3'],
 ['tra','Bolo palma','Desde 3 metros, lanza la bola rodando y tira bolos del cuadro de 9.','3 bolos','Desde 2 metros y sentado, lanza la bola y tira bolos del cuadro de 9.','2 bolos','Con la rampa, lanza la bola y tira bolos del cuadro.','1 bolo','Bolos, pelota, rampa.','El bolo palma es el juego tradicional de Asturias: 9 bolos en cuadro. Cuenta con él los bolos caídos.','bolos,pelota;bolos,pelota;bolos,pelota,rampa','4,2|E1,C3|4.1,2.3'],

function pathCells(L){
  const {R,C}=L;let r=R-1,c=0;const out=[[r,c]];
  const segs=L.loops===1?[[0,1,C-1],[-1,0,R-1],[0,-1,C-1],[1,0,R-2]]:[[0,1,C-1],[-1,0,R-1],[0,-1,C-1],[1,0,R-3],[0,1,C-3],[-1,0,R-5],[0,-1,C-5],[1,0,R-7]];
  for(const [dr,dc,n] of segs)for(let k=0;k<n;k++){r+=dr;c+=dc;out.push([r,c])}
  return out;
}

function buildSpecials(size){
  const L=LAYOUTS[size].sp,sp={};
  L.oca.forEach((p,i)=>sp[p]={type:'oca',to:L.oca[i+1]??size,extra:true});
  L.puente.forEach(([a,b])=>{sp[a]={type:'puente',to:b,extra:true};sp[b]={type:'puente',decor:true}});
  L.dados.forEach(([a,b])=>{sp[a]={type:'dados',to:b,extra:true};sp[b]={type:'dados',decor:true}});
  L.posada.forEach(p=>sp[p]={type:'posada',to:null,extra:false});
  L.laberinto.forEach(([a,b])=>sp[a]={type:'laberinto',to:b,extra:false});
  return sp;
}

let bgRAF=null,bgItems=null;
function bgSize(){const cv=$('#bg');if(!cv)return;const d=Math.min(2,window.devicePixelRatio||1);cv.width=innerWidth*d;cv.height=innerHeight*d}
function drawBgItem(ctx,o,W,H,d){
  const x=o.x*W,y=o.y*H,r=o.r*d;ctx.save();ctx.translate(x,y);ctx.rotate(o.a);ctx.globalAlpha=o.al;
  if(o.t===0){ctx.fillStyle='#fff';ctx.strokeStyle='#3a2416';ctx.lineWidth=2*d;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='#3a2416';ctx.beginPath();for(let i=0;i<5;i++){const a=i*1.2566-1.57;ctx.lineTo(Math.cos(a)*r*.4,Math.sin(a)*r*.4)}ctx.closePath();ctx.fill()}
  else if(o.t===1){ctx.fillStyle='#e8762c';ctx.strokeStyle='#3a2416';ctx.lineWidth=2*d;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(-r,0);ctx.lineTo(r,0);ctx.moveTo(0,-r);ctx.lineTo(0,r);ctx.stroke();ctx.beginPath();ctx.arc(-r*1.15,0,r*.75,-.9,.9);ctx.stroke();ctx.beginPath();ctx.arc(r*1.15,0,r*.75,Math.PI-.9,Math.PI+.9);ctx.stroke()}
  else{ctx.fillStyle=o.c;const w=r*1.6,h=r*1.9,k=r*.6;ctx.beginPath();ctx.moveTo(-w/2+k,-h/2);ctx.lineTo(w/2-k,-h/2);ctx.quadraticCurveTo(w/2,-h/2,w/2,-h/2+k);ctx.lineTo(w/2,h/2-k);ctx.quadraticCurveTo(w/2,h/2,w/2-k,h/2);ctx.lineTo(-w/2+k,h/2);ctx.quadraticCurveTo(-w/2,h/2,-w/2,h/2-k);ctx.lineTo(-w/2,-h/2+k);ctx.quadraticCurveTo(-w/2,-h/2,-w/2+k,-h/2);ctx.fill()}
  ctx.restore();
}
function startBg(){
  const cv=$('#bg');if(!cv||!cv.getContext)return;cancelAnimationFrame(bgRAF);bgSize();
  const ctx=cv.getContext('2d'),cols=['#F7C929','#009846','#0098F3'];if(!ctx)return;
  if(!bgItems)bgItems=Array.from({length:20},(_,i)=>({x:Math.random(),y:Math.random(),r:14+Math.random()*30,v:.0004+Math.random()*.0008,a:Math.random()*6.28,s:(Math.random()-.5)*.012,t:i%5<2?i%5:2,c:cols[i%3],al:i%5<2?.85:.28}));
  const d=Math.min(2,window.devicePixelRatio||1);
  const frame=()=>{const W=cv.width,H=cv.height;ctx.clearRect(0,0,W,H);
    bgItems.forEach(o=>{if(!REDUCE){o.y-=o.v;o.a+=o.s;if(o.y<-.08){o.y=1.08;o.x=Math.random()}}drawBgItem(ctx,o,W,H,d)});
    if(!REDUCE&&screen==='home')bgRAF=requestAnimationFrame(frame)};
  frame();
}
function stopBg(){cancelAnimationFrame(bgRAF);try{const cv=$('#bg'),c=cv&&cv.getContext&&cv.getContext('2d');if(c)c.clearRect(0,0,cv.width,cv.height)}catch(e){}}
addEventListener('resize',()=>{if(screen==='home'){bgSize();if(REDUCE)startBg()}});
