function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function spread(list){const a=shuffle(list);for(let i=1;i<a.length;i++){if(a[i].cat===a[i-1].cat){const j=a.findIndex((x,k)=>k>i&&x.cat!==a[i-1].cat);if(j>0)[a[i],a[j]]=[a[j],a[i]]}}return a}
function boardCats(tema,ej,raw,off){const all=[...new Set(RETOS.filter(r=>inTemaRaw(r,tema,ej)&&r.cat!=='cal').map(r=>r.cat))];if(raw)return all;
  const o=off||((cfg&&cfg.off)||[]),s=all.filter(c=>!o.includes(c));return s.length>=2?s:(all.length?all:['coo'])}
function buildBoard(size,tema,sp,ej,feas){
  let cats=boardCats(tema,ej||[]);if(feas){const f=cats.filter(feas);if(f.length>=2)cats=f}const b=[null];let seq=[],last=null;
  const CATW=tema==='animales'?{ades:2}:{},bag=cats.flatMap(c=>Array(CATW[c]||1).fill(c).concat(catFocus(c)?[c]:[]));
  for(let i=1;i<size;i++){
    if(sp[i]&&sp[i].type==='posada'){b.push('cal');continue}
    if(!seq.length)seq=shuffle(bag);let k=seq.findIndex(c=>c!==last);if(k<0)k=0;last=seq.splice(k,1)[0];b.push(last);
  }
  return b;
}

function basePool(p,tema){
  const lv=p.level||'A',nv=+p.nivel||2;
  let pool=RETOS.filter(r=>inTema(r,tema)&&r.nivel===nv&&versionOK(r,lv));
  if(!pool.length)pool=RA().filter(r=>r.nivel===nv&&versionOK(r,lv));
  if(!pool.length)pool=RA().filter(r=>versionOK(r,lv));
  return pool;
}
const deckSig=(p,tema)=>`${p.level||'A'}${+p.nivel||2}${tema}|${matsKey(cfg)}|${(cfg.off||[]).join(',')}`;
const needsOf=(r,p)=>r?[...new Set((r['need'+(p.level||'A')]||[]).map(k=>resolveMat(k)||k))]:[];
function buildDeckFor(p,mats){
  const tema=game.tema,pool=basePool(p,tema);if(!pool.length)return [];
  const cats=[...new Set(game.board.filter(Boolean))];
  const seen=new Set(((cfg.hist||{})[p.id])||[]);
  const pf0=prefFor(p),deck=[],costOf=r=>needsOf(r,p).filter(k=>!mats.has(k)).length+(seen.has(r.id)?.6:0)-(pf0&&pf0(r)?.5:0);
  const take=r=>{deck.push(r.id);needsOf(r,p).forEach(k=>mats.add(k))};
  const best=list=>{let m=Infinity,c=[];list.forEach(r=>{const x=costOf(r);if(x<m){m=x;c=[r]}else if(x===m)c.push(r)});return c.length?c[rnd(c.length)]:null};
  for(let round=0;round<3;round++)shuffle(cats).forEach(cat=>{const r=best(pool.filter(r=>r.cat===cat&&!deck.includes(r.id)));if(r)take(r)});
  const target=Math.max(16,Math.ceil((game.size||24)/2),cats.length*3);
  for(let g=0;deck.length<target&&g<40;g++){const r=best(pool.filter(r=>!deck.includes(r.id)));if(!r)break;take(r)}
  return deck;
}
function ensureDecks(){
  if(!game)return;game.deck=game.deck||{};game.deckSig=game.deckSig||{};

    if(!game.deck[p.id]||game.deckSig[p.id]!==sig){game.deck[p.id]=buildDeckFor(p,mats);game.deckSig[p.id]=sig;changed=true}});

async function evaluate(res){

  const id=curId(),p=getP(id);game.log[id]=game.log[id]||{ok:0,help:0,bad:0};game.log[id][res]++;
  game.mlog=game.mlog||{};(p.team?p.members:[id]).forEach(m=>{game.mlog[m]=game.mlog[m]||{ok:0,help:0,bad:0};game.mlog[m][res]++});
  game.ev=game.ev||[];const n0=game.ev.length,pm=game.pm;game.pm=null;(p.team?p.members:[id]).forEach(m=>{const rid=p.team?((game.current&&game.current.team)||{})[m]:game.current;if(rid&&typeof rid==='string')game.ev.push({...evEntry(m,rid,res),...(res==='help'&&game.aid?{aid:game.aid}:{}),...(pm&&!p.team?ptiMark(realP(m),getR(rid),pm.pi,pm.mk):{})})});

  game.partner=[];game.ppOpen=false;game.aid=null;saveSession();fixChipFor(game.ev.slice(n0));
  game.phase='moving';renderTurn();renderRank();

  else if(res==='help'){SFX.help();speak(SAY.help(p.name));await showMoment(p,'help','¡Con ayuda también vale!','Te quedas en tu casilla')}

  nextTurn();

function finish(id){

  show('#ov-win');

function nextTurn(){
  game.again=false;

function undo(){

  const y=schoolYear(),D=(a,b,c2,end)=>new Date(a,b,c2,end?23:0,end?59:0).getTime();
  if(p==='t1')return [D(y,8,1),D(y,11,31,1)];if(p==='t2')return [D(y+1,0,1),D(y+1,2,31,1)];if(p==='t3')return [D(y+1,3,1),D(y+1,5,30,1)];
  if(p==='curso')return [D(y,8,1),D(y+1,7,31,1)];if(/^\d+$/.test(p))return [Date.now()-(+p)*864e5,Infinity];return [0,Infinity];
}

  return `<div class="pf-chart"><svg viewBox="0 0 ${W} ${H}" style="max-width:${W}px;min-width:${Math.min(W,480)}px" role="img" aria-label="Evolución">${g}</svg></div><p class="pf-legend"><i style="--c:#2e8b57"></i>Lo hace solo <i style="--c:#d99a00"></i>Solo o con ayuda</p>`;
}

function kpis(list,nGames){
  const t=tally(list);

    <div class="pf-kpi k-ok"><b>${pct(t.ok,t.n)}%</b><span>Solo</span></div><div class="pf-kpi k-help"><b>${pct(t.help,t.n)}%</b><span>Con ayuda</span></div><div class="pf-kpi k-bad"><b>${pct(t.bad,t.n)}%</b><span>No</span></div></div>`;
}
function critTable(list,ref,full){
  const by={};list.forEach(e=>vOfEv(e,ref).crit.forEach(k=>(by[k]=by[k]||[]).push(e)));
  const keys=(full?allCrit(ref):Object.keys(by)).sort(critSort);
  if(!keys.length)return '<p class="pf-empty">Sin registros todavía.</p>';
  return `<table class="pf-table"><thead><tr><th>Criterio de evaluación</th><th class="n">Registros</th><th>Resultado</th><th>Valoración</th></tr></thead><tbody>${keys.map(k=>{const t=tally(by[k]||[]);
    return `<tr class="${t.n?'':'mute'}"><td><b>${esc(critCode(k,ref))}</b> <span class="pf-crit" title="${esc(critText(k,ref))}">${esc(critText(k,ref))}</span></td><td class="n">${t.n}</td><td>${resBar(t)}</td><td>${logroPill(logroOf(t))}</td></tr>`}).join('')}</tbody></table>`;
}
function ceSummary(list,ref){
  const by={};list.forEach(e=>vOfEv(e,ref).ce.forEach(k=>(by[k]=by[k]||[]).push(e)));
  const keys=isInf(ref)?Object.keys(CURI.CE):['1','2','3','4','5'];
  return `<div class="pf-ces">${keys.map(k=>{const t=tally(by[k]||[]);return `<div class="pf-ce ${t.n?'':'mute'}"><div class="pf-ceh"><b>${esc(ceCode(k,ref))}</b><span>${esc(ceName(k,ref))}</span></div>${resBar(t)}<small>${t.n?`${t.n} registros · ${pct(t.ok,t.n)}% solo`:'Sin trabajar en este periodo'}</small></div>`}).join('')}</div>`;
}
function sabSummary(list,ref){
  const by={};list.forEach(e=>vOfEv(e,ref).sab.forEach(k=>by[k]=(by[k]||0)+1));
  const keys=Object.keys(by).sort();if(!keys.length)return '<p class="pf-empty">Sin registros todavía.</p>';
  return `<div class="pf-chips">${keys.map(k=>`<span class="pf-chip" style="--bc:${sabBloq(k,ref).c||'#888'}" title="${esc(sabBloq(k,ref).n+'. '+sabText(k,ref))}"><b>${esc(sabCode(k,ref))}</b> ${esc(isInf(ref)?sabText(k,ref).split(':')[0].slice(0,48):(CURP.SAB[k]?CURP.SAB[k].n:''))} <em>${by[k]}</em></span>`).join('')}</div>`;
}

function evRow(s,e,i){return `<li class="pf-evr"><button class="pf-evb" data-act="pf-ev" data-s="${s.id}" data-i="${i}" title="Toca para cambiar la valoración: Solo → Con ayuda → No"><span class="pf-dot" style="--c:${RES[e.res].c}"></span><span>${esc(e.ti||'')}<small>${esc(CAT(e.cat).n)}${e.aid?' · ayuda '+AID[e.aid]:''}${e.con?' · en pareja':''}${e.pareja?' · con '+esc(pairNames(e.pareja)||'compañero'):''}${e.bm&&e.pi&&bItem(e.pi)?' · PTI '+esc(bTag(bItem(e.pi))):''}</small></span><em style="--c:${RES[e.res].c}">${e.bm||RES[e.res].n}</em></button><button class="pf-x" data-act="pf-ev-del" data-s="${s.id}" data-i="${i}" data-confirm="1" aria-label="Borrar este resultado" title="Borrar este resultado">×</button></li>`}

function csvOf(c){
  const ss=pfSessions(c),ref=refOf(c.cfg),q=v=>`"${String(v??'').replace(/"/g,'""')}"`;

  const rows=ss.flatMap(s=>s.ev.map(e=>{const p=s.players.find(x=>x.id===e.m)||{name:''},v=vOfEv(e,ref);return [new Date(e.t||s.date).toLocaleString('es-ES'),s.className,p.name,e.lv,e.nv,e.ti,CAT(e.cat).n,RES[e.res].n,e.aid?AID[e.aid]:'',v.ce.map(k=>ceCode(k,ref)).join(' '),v.crit.map(k=>critCode(k,ref)).join(' '),v.sab.map(k=>sabCode(k,ref)).join(' ')]}));

async function jEval(res){
  if(!J||J.phase!=='reto')return;const p=jP(),r=getR(J.cur),JJ=J;
  J.phase='saving';{const pm=J.pm;J.pm=null;const s0=(SESS.find(x=>x.id===J.sid)||{ev:[]}).ev.length,pr=(J.partner||[]).filter(x=>x!==p.id&&realP(x));
    jAddEv(p.id,r.id,res,{...(pm?ptiMark(p,r,pm.pi,pm.mk):{}),...(pr.length?{pareja:pr}:{})});pr.forEach(q=>jAddEv(q,r.id,res,{con:p.id,...(pm?ptiMark(realP(q),r,pm.pi,pm.mk):{})}));
    J.partner=[];J.ppOpen=false;fixChipFor(fixList().slice(s0))}
  if(J.g==='ruleta'){jMusicOff();if(res!=='bad'){J.phase='party';jingle(rnd(6));speak(`${PRAISE[rnd(PRAISE.length)]}, ${p.name}! Una bola para el tarro.`);await jJarAdd(p.id)}else{SFX.help();speak(`¡Buen intento, ${p.name}!`);await sleep(1200)}J.jar.drop=false}
  else await jParty(res);
  if(!J||J.ended||J!==JJ)return;jNextTurn();
}
function jOther(){
  if(!J)return;const p=jP();
  if(J.g==='fiesta'){if(J.opt.mode!=='mueve')return;const r=jPick(p,jPool(p,1).filter(r=>r.id!=='k1-1'),J.cur);if(r){J.cur=r.id;renderMini();speak(titleOf(r,jLv(p))+'. '+r[jLv(p)])}return}
  if(J.phase!=='reto')return;const cur=getR(J.cur),pool=jPool(p,J.g==='caja'?1:2),same=pool.filter(r=>r.cat===cur.cat&&r.id!==cur.id);
  const r=jPick(p,same.length?same:pool,J.cur);if(!r)return;J.cur=r.id;jSeen(p,r.id);renderMini();SFX.tick();speak(`¡${titleOf(r,jLv(p))}! ${r[jLv(p)]}`);
}
function jSwitch(){if(!J)return;if(J.g==='gp'){gpNext();return}if(J.g==='fiesta')jFiesta();else if(J.g==='caja')jOpenBox();else jSpin()}
function jSummary(){
  const s=SESS.find(x=>x.id===J.sid),ev=s?s.ev:[];
  const rows=J.order.map(realP).filter(Boolean).map(p=>{const es=ev.filter(e=>e.m===p.id),t=tally(es);const n=es.reduce((a,e)=>a+(e.n||0),0);
    return `<li>${avatarHTML(p,'')}<span class="js-n"><b>${esc(p.name)}</b><small>${es.length?`${es.length} ${es.length===1?'registro':'registros'}${J.g==='fiesta'?` · ${n} activaciones`:''}`:'Sin registros'}</small></span>${es.length?resBar(t):''}<span class="js-t">${t.ok} solo · ${t.help} ayuda · ${t.bad} no</span></li>`}).join('');
  $('#sh-jsum').innerHTML=`<h2>${esc(JUEGOS[J.g].n)} · resumen</h2><p class="small">Todo está guardado en Profesorado, en la ficha de cada alumno y en «Partidas». Allí puedes corregir o borrar cualquier registro.</p><ul class="jsum">${rows}</ul>
    <div class="foot"><button class="btn primary" data-act="j-close-sum">Seguir jugando</button><button class="btn" data-act="j-finish">Terminar y volver al inicio</button><button class="btn" data-act="j-prof">Ver en Profesorado</button></div>`;
  show('#ov-jsum');
}
function jEnd(){document.querySelectorAll('.jj-party').forEach(x=>x.remove());if(!J)return;J.ended=true;jMusicOff();document.body.classList.remove('jdark');J=null;go('home')}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act^="j-"]');if(!b)return;const a=b.dataset.act,v=b.dataset.v;
  if(screen==='mini'&&document.activeElement&&document.activeElement.blur)setTimeout(()=>{try{document.activeElement.blur()}catch(x){}},0);
  switch(a){
    case 'j-absent':{const k=activeId,s=new Set(JH.absent[k]||[]);s.has(b.dataset.id)?s.delete(b.dataset.id):s.add(b.dataset.id);JH.absent[k]=[...s];if(!$('#ov-jset').hidden&&JH.open)$('#sh-jset').innerHTML=jOptHTML(JH.open);if(screen==='juegos')renderJuegos();if(screen==='setup')renderSetup();break}
    case 'j-open':JH.open=v;$('#sh-jset').innerHTML=jOptHTML(v);show('#ov-jset');break;
    case 'j-opt':{const g=b.dataset.g,f=b.dataset.f;let val=v;if(['dur','teams','secs','len'].includes(f))val=+v;if(['dark','duel','adapt'].includes(f))val=v==='true';JH.opt[g][f]=val;$('#sh-jset').innerHTML=jOptHTML(g);break}
    case 'j-close':hide('#ov-jset');break;
    case 'j-start':jStart(v);break;
    case 'j-close-x':break;
    case 'j-resume':if(J){go('mini');if(J.g!=='gp')jTurn()}break;
    case 'j-mats':step=3;go('setup');break;
    case 'j-hit':jFiesta();break;
    case 'j-rate':if(J&&J.g==='fiesta'){J.phase='rate';jMusicOff();$('#jAdult').innerHTML=rateHTML(jP())}break;
    case 'j-rated':if(J){const p=jP();if(v){jAddEv(p.id,J.cur||'k1-1',v,{n:J.count});fixChipFor(fixList().slice(-1))}jNextTurn()}break;
    case 'j-box':jOpenBox();break;
    case 'j-spin':jSpin();break;
    case 'j-eval':jEval(v);break;
    case 'j-other':jOther();break;
    case 'j-goto':if(J&&['play','box','spin'].includes(J.phase)){J.turn=+v;jTurn()}break;
    case 'j-newwheel':if(J&&J.phase==='spin'){jWheelBuild();renderMini();SFX.tick()}break;
    case 'j-end':if(J){jMusicOff();jSummary()}break;
    case 'j-close-sum':hide('#ov-jsum');break;
    case 'j-finish':hide('#ov-jsum');jEnd();break;
    case 'j-prof':hide('#ov-jsum');{const sid=J&&J.sid;jEnd();pf.from='juegos';pf.classId=activeId;pf.tab='sesiones';pf.sid=sid;go('prof')}break;
    case 'j-back':jMusicOff();go('home');break;
    case 'j-hub':if(SFX.meta)SFX.meta();go('juegos');break;
  }
});
document.addEventListener('change',e=>{if(e.target.id==='jClass'){activeId=e.target.value;history=[];loadClass();savePrefs();if(!$('#ov-jset').hidden&&JH.open)$('#sh-jset').innerHTML=jOptHTML(JH.open);if(screen==='juegos')renderJuegos();if(screen==='home')renderHome()}});
document.addEventListener('keydown',e=>{

/* ================= CREAR PARTIDA DESDE EL PROFESORADO ================= */
const CPJ={
  fiesta:{temas:null,ejes:false,opts:'fiesta'},
  caja:{temas:['ambos','animales','basico'],ejes:false,cog:1},
  ruleta:{temas:['ambos','animales','basico','general','todo','futbol','baloncesto','floorball','boccia'],ejes:true,cog:2},
  oca:{temas:Object.keys(TEMAS),ejes:true}
};
['futbol','baloncesto','floorball','boccia'].forEach(k=>JCONT[k]={n:TEMAS[k].n,t:[k]});
const jTemas=(g,opt)=>g==='fiesta'?['basico']:(JCONT[opt.cont]||JCONT.ambos).t;
const matOK=(r,p)=>needsOf(r,p).every(hasMat);
function jBase(p,g,opt,noOff,noMat){
  const lv=jLv(p),off=new Set(noOff?[]:(opt.off||[])),ej=new Set(opt.ejes||[]),temas=jTemas(g,opt);
  return RETOS.filter(r=>r.id!=='k1-1'&&!off.has(r.cat)&&(EJECATS.has(r.cat)?(ej.has(r.cat)&&(temas.includes(r.tema)||r.tema==='general')):temas.includes(r.tema))&&versionOK(r,lv)&&(noMat||matOK(r,p)));
}
function jPoolFor(p,g,opt,maxCog){
  const nv=+p.nivel||1;
  for(const [noMat,noOff] of [[false,false],[false,true],[true,false],[true,true]]){const base=jBase(p,g,opt,noOff,noMat);
    const tries=[r=>cogOf(r)<=maxCog&&r.nivel<=nv,r=>cogOf(r)<=maxCog,r=>cogOf(r)<=maxCog+1&&r.nivel<=Math.max(nv,2),()=>true];
    for(const f of tries){const l=base.filter(f);if(l.length)return l}}
  return [];
}
function jPrefFn(p,opt){
  const os=opt.pti===false?[]:objsOf(p),fc=opt.focus||[],ref=refOf();
  if(!os.length&&!fc.length)return null;
  return r=>{const v=rView(r,ref);return os.some(o=>(o.cats||[]).includes(r.cat)||v.crit.some(k=>(o.crit||[]).includes(k)))||v.crit.some(k=>fc.includes(k))};
}
/* categorías que se pueden elegir para un juego y una temática */
function cpCats(g,o){
  if(g==='oca')return boardCats(o.tema,o.ejes||[],true).filter(c=>!EJECATS.has(c));
  const temas=jTemas(g,o),mc=(CPJ[g]||{}).cog||1;
  return [...new Set(RETOS.filter(r=>r.id!=='k1-1'&&temas.includes(r.tema)&&!EJECATS.has(r.cat)&&cogOf(r)<=mc).map(r=>r.cat))];
}
/* cuántos retos distintos podrá hacer cada alumno con lo elegido */
function cpCount(p,g,o){
  const lv=jLv(p),nv=+p.nivel||2;
  if(g==='oca'){const off=new Set(o.off||[]);return RETOS.filter(r=>!off.has(r.cat)&&inTemaRaw(r,o.tema,o.ejes||[])&&r.nivel===nv&&versionOK(r,lv)).length}
  if(g==='fiesta')return jPoolFor(p,'fiesta',o,1).filter(r=>matOK(r,p)).length;
  return jPoolFor(p,g,o,(CPJ[g]||{}).cog||2).filter(r=>!(o.off||[]).includes(r.cat)&&matOK(r,p)).length;
}
function cpDefault(c,g){
  const cf=c.cfg,last=(cf.cp&&cf.cp[g])||{};
  if(g==='oca')return {tema:cf.tema||'general',size:+cf.size||24,mode:cf.mode||'ind',specials:cf.specials!==false,off:(cf.off||[]).slice(),ejes:(cf.ejes||[]).slice(),focus:(cf.focus||[]).slice(),pti:true,...last};
  return {...JH.opt[g],off:[],ejes:[],focus:[],pti:true,...last};
}
function cpState(){const c=pfClass();if(!pf.cp||pf.cp.classId!==c.id)pf.cp={classId:c.id,g:(c.cfg.cp&&c.cfg.cp.last)||'caja'};if(!pf.cp.o||pf.cp.og!==pf.cp.g){pf.cp.o=cpDefault(c,pf.cp.g);pf.cp.og=pf.cp.g}return pf.cp}
const cpSummary=(g,o)=>{const t=g==='oca'?TEMAS[o.tema].n:g==='fiesta'?(o.mode==='mueve'?'Se mueve y el adulto activa':'El alumno pulsa'):(JCONT[o.cont]||JCONT.ambos).n;
  const cats=cpCats(g,o).filter(k=>!(o.off||[]).includes(k));const all=cpCats(g,o).length;
  return [JUEGOS[g].n,t,g==='fiesta'?'':(cats.length===all?'Todos los tipos de reto':cats.map(k=>CAT(k).n).join(', ')),(o.ejes||[]).length?'Saberes: '+EJES.filter(e=>o.ejes.includes(e[0])).map(e=>e[2]).join(', '):''].filter(Boolean).join(' · ')};

  const temaUI=g==='fiesta'?'':`<div class="field"><span class="flabel">Temática</span><div class="jsegs">${(g==='oca'?CPJ.oca.temas.map(k=>[k,TEMAS[k].n,TEMAS[k].d]):CPJ[g].temas.map(k=>[k,JCONT[k].n,''])).map(([k,n,d])=>seg(g==='oca'?'tema':'cont',k,esc(n),esc(d||''))).join('')}</div></div>`;
  const optUI=g==='fiesta'?`<div class="field"><span class="flabel">¿Quién activa la fiesta?</span><div class="jsegs">${seg('mode','pulsa','El alumno pulsa','Pantalla o pulsador')}${seg('mode','mueve','El adulto, cuando se mueve','Sale un movimiento sencillo')}</div></div>
      <div class="field"><span class="flabel">Música en cada fiesta</span><div class="jsegs">${seg('dur',3,'Corta','3 s')}${seg('dur',5,'Media','5 s')}${seg('dur',8,'Larga','8 s')}</div></div>
      <div class="field"><span class="flabel">Fondo</span><div class="jsegs">${seg('dark',false,'Claro')}${seg('dark',true,'Oscuro, alto contraste','Baja visión o deficiencia visual cerebral')}</div></div>`
    :g==='gp'?gpOptsHTML(seg)
    :g==='oca'?`<div class="field"><span class="flabel">Tablero</span><div class="jsegs">${Object.entries(LAYOUTS).map(([k,l])=>seg('size',+k,esc(l.name),k+' casillas')).join('')}</div></div>
      <div class="field"><span class="flabel">Modo</span><div class="jsegs">${seg('mode','ind','Individual','Cada alumno con su ficha')}${seg('mode','team','Por equipos','Equipos mezclando perfiles')}</div></div>
      <div class="field"><span class="flabel">Casillas especiales</span><div class="jsegs">${seg('specials',true,'Sí','Ocas, puentes, posada…')}${seg('specials',false,'No','Tablero más sencillo')}</div></div>`:'';
  const mats=c.cfg.mats,hasM=k=>!mats||mats.includes(k);

  ${c.cfg.prep?`<div class="cp-prep">${icon('star',3)}<span><b>Hay una partida preparada:</b> ${esc(cpSummary(c.cfg.prep.g,c.cfg.prep.o))}</span><button class="pf-link danger" data-act="cp-unprep">Quitarla</button></div>`:''}
  <section class="pf-card"><h3><span class="cp-n">1</span>¿Quién juega?</h3><p class="pf-note">Toca a quien no esté hoy. ${ps.length} de ${(c.players||[]).length}.</p>
    <div class="jh-faces sm">${(c.players||[]).map(p=>`<button class="jh-face ${ab.has(p.id)?'off':''}" data-act="cp-absent" data-id="${p.id}" aria-pressed="${!ab.has(p.id)}">${avatarHTML(p,'')}<span>${esc(p.name)}</span><small>${p.level||'A'} · N${+p.nivel||2}</small></button>`).join('')||'<p class="pf-empty">Esta clase no tiene alumnos.</p>'}</div></section>
  <section class="pf-card"><h3><span class="cp-n">2</span>¿A qué jugamos?</h3>
    <div class="cp-games">${JORDER.map(k=>{const j=JUEGOS[k];return `<button class="cp-g ${g===k?'on':''}" style="--jc:${j.c}" data-act="cp-game" data-v="${k}"><span class="cp-ga">${k==='oca'?ART.oca:JART[k]}</span><span class="cp-gt"><small>Nivel ${j.k} · ${esc(j.d)}</small><b>${esc(j.n)}</b><span>${esc(j.ex)}</span><em>Para: ${esc(j.who)}</em></span></button>`}).join('')}</div></section>
  <section class="pf-card"><h3><span class="cp-n">3</span>¿Qué quieres trabajar?</h3>

  <section class="pf-card cp-sum"><h3>Así queda</h3><p class="cp-line">${esc(cpSummary(g,o))}</p>
    <ul class="cp-list">${counts.map(([p,n])=>`<li class="${n<3?'low':''}">${avatarHTML(p,'sm')}<b>${esc(p.name)}</b><small>Perfil ${p.level||'A'} · N${+p.nivel||2}${o.pti!==false&&objsOf(p).length?' · con objetivos PTI':''}</small><span>${n} ${n===1?'reto posible':'retos posibles'}</span></li>`).join('')||'<li>No hay alumnos seleccionados.</li>'}</ul>
    ${counts.some(([p,n])=>n<3)?'<p class="pf-note warn">Algún alumno tiene muy pocos retos con esta selección: marca más material o más tipos de reto, o se repetirán.</p>':''}
    <div class="cp-acts"><button class="btn primary big" data-act="cp-start" ${ps.length?'':'disabled'}>${PLAY}Empezar ahora</button><button class="btn big" data-act="cp-prep" ${ps.length?'':'disabled'}>${icon('star',3)}Dejar preparada</button></div></section>
  </div>`;

function cpRemember(c,g,o){c.cfg.cp=c.cfg.cp||{};c.cfg.cp[g]=JSON.parse(JSON.stringify(o));c.cfg.cp.last=g}

document.addEventListener('click',e=>{

  switch(a){
    case 'go-crear':pf.from=screen;pf.classId=activeId;pf.tab='crear';pf.sid=null;go('prof');break;
    case 'go-eval':pf.from=screen;pf.classId=activeId;pf.tab='alumnado';pf.pid=null;go('prof');break;
    case 'cp-absent':{const s=new Set(JH.absent[c.id]||[]);s.has(b.dataset.id)?s.delete(b.dataset.id):s.add(b.dataset.id);JH.absent[c.id]=[...s];renderProf();break}

  const win=J.teams.filter(t=>t.pos>=J.L);
  if(win.length){J.phase='win';renderMini();SFX.meta();confetti();setTimeout(confetti,700);jMusic(8);const w=J.teams.slice().sort((a,b)=>b.pos-a.pos)[0];speak(`¡${w.name} gana el Gran Premio! ¡Enhorabuena a todos!`);return}

  const lead=J.teams.slice().sort((a,b)=>b.pos-a.pos)[0];speak(cu.duel&&cu.winner?`¡Punto para ${gpTeamOf(cu.winner).name}!`:`¡${lead.name} va en cabeza!`);
}

});

function bNameScore(pn,r){const a=bNorm(pn).split(' ')[0]||'',full=bNorm(pn),b=bNorm(r.nombre),bf=bNorm(r.nombreCompleto),b0=b.split(' ')[0]||'';
  if(!a)return 0;if(full===b||full===bf)return 5;if(a===b0)return 4;if(bf.startsWith(full)&&full.length>=3)return 3;if(a.length>=3&&(b0.startsWith(a)||a.startsWith(b0)))return 2;if(a.slice(0,3)===b0.slice(0,3))return 1;return 0}
function bAutoLink(c){let ch=0;const recs=bRecsOfClass(c),used=new Set((c.players||[]).map(p=>p.bid).filter(Boolean));
  (c.players||[]).forEach(p=>{if((p.bid&&BREC[p.bid])||p.bunlink)return;let best=null,bs=0,tie=false;recs.forEach(([id,r])=>{if(used.has(id))return;const s=bNameScore(p.name,r);if(s>bs){bs=s;best=id;tie=false}else if(s&&s===bs)tie=true});
    if(best&&bs>=1&&!tie){p.bid=best;used.add(best);ch++}});return ch}

function bNivelGen(r,p){const h=bHist(r),per={};for(const o in h){const b=bItem(o);if(b&&h[o].e>=0)per[b.a]=Math.max(per[b.a]||0,b.n)}const v=Object.values(per).sort((a,b)=>a-b);if(!v.length)return bPerfil(p,r)==='AU'?3:2;return v[Math.floor((v.length-1)/2)]}

function bProp(p,r,t){const pa=bPa(p,r);if(!pa||!BOLB.prog[pa]||pa==='EST')return bSugMapa(p,r);const inP=new Set(ptiIds(p)),max=/4 o 5/.test(BOLB.prog[pa].elegir||'')?5:4;
  const done=id=>{const le=bLast(p.pti&&p.pti[id]);return le&&bLogrado(le.v)};const by={};
  BOLB.pitems.filter(b=>b.prog===pa&&b.tri.includes(t)).forEach(b=>(by[b.bl]=by[b.bl]||[]).push(b));
  const out=[];Object.keys(by).sort((a,b)=>a-b).forEach(bl=>{const nx=by[bl].sort((x,y)=>bNum(x.num).localeCompare(bNum(y.num))).find(b=>!inP.has(b.id)&&!done(b.id));if(nx)out.push(nx.id)});
  const ya=[...inP].filter(id=>bItem(id).prog===pa&&!done(id)).length;return out.slice(0,Math.max(0,max-ya))}
function bSugMapa(p,r){const h=bHist(r),gen=bNivelGen(r,p),pf=bPerfil(p,r),inP=new Set(ptiIds(p)),out=[];
  BOLB.ambitos.forEach(a=>{const w=Object.keys(h).filter(o=>h[o].e>=0).map(bItem).filter(b=>b&&b.a===a.id&&!b.prog);let l=[];
    if(w.length){const pend=w.filter(b=>h[b.id].e<3);if(pend.length)l=pend;else{const L=Math.max(...w.map(b=>b.n))+1;if(L<=5)l=BOLB.items.filter(b=>b.a===a.id&&b.n===L&&bFits(b,pf)&&!h[b.id])}}

/* indicadores del PTI del alumno que encajan con el tipo de reto */
function ptiFor(p,r){
  if(!p||!r||!p.pti)return [];
  const its=ptiIds(p).map(bItem).filter(Boolean),m=its.filter(it=>bCats(it).includes(r.cat));
  const done=it=>{const le=bLast(p.pti[it.id]);return le&&bLogrado(le.v)?1:0};
  return m.sort((a,b)=>done(a)-done(b)).slice(0,3);
}
/* escribe la marca en el trimestre actual del PTI y devuelve los datos para el registro */
function ptiMark(p,r,pi,mk){
  if(!p||!mk||!p.pti)return {};
  let it=pi&&p.pti[pi]&&p.pti[pi].sel&&bItem(pi)?pi:null;
  if(!it){const l=ptiFor(p,r);it=l[0]&&l[0].id}
  if(!it)return {};
  const T=bTri(),x=p.pti[it],prev=x['t'+T]||'';x['t'+T]=mk;
  return {pi:it,bm:mk,prev,tri:T};
}
function ptiUnmark(e,mk,pp){ /* deshace o cambia la marca escrita por un registro */
  const p=pp||realP(e.m);if(!p||!e.pi||!p.pti||!p.pti[e.pi])return;const x=p.pti[e.pi],k='t'+(e.tri||bTri());

}

  const row=it=>{const cur=(p.pti[it.id]||{})[T]||'';return `<div class="pmi"><span class="pmi-t"><b>${esc(bTag(it))}</b> ${esc(it.ind)}</span><div class="pmb">${E.map(mk=>mkBtn(ctx,it.id,mk,cur)).join('')}</div></div>`};

function fixApply(i,v,del){
  const l=fixList(),e=l[i];if(!e)return;

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#ov-player').hidden){hide('#ov-player');draft=null;return}
  if(screen==='home'&&$('#ov-set').hidden&&(e.code==='Space'||e.key==='Enter')){const t=e.target;if(t.closest&&t.closest('button,input,textarea,select'))return;e.preventDefault();unlockAudio();homeMain();return}
  if(screen!=='game')return;
  if(!$('#ov-sp').hidden&&(e.code==='Space'||e.key==='Enter')){e.preventDefault();if(spResolve)spResolve();return}
  if(!$('#ov-turn').hidden&&(e.code==='Space'||e.key==='Enter')){e.preventDefault();clearTimeout(splashT);hide('#ov-turn');return}
  if(!$('#ov-intro').hidden&&(e.code==='Space'||e.key==='Enter')){const t=e.target;if(t.closest&&t.closest('button'))return;e.preventDefault();const g=document.querySelector('[data-act=intro-go]')||document.querySelector('[data-act=intro-close]');if(g)g.click();return}
  if(!$('#ov-dice').hidden&&(e.code==='Space'||e.key==='Enter')){e.preventDefault();if(diceResolve)diceResolve();return}
  if(stepWait&&(e.code==='Space'||e.key==='Enter')){e.preventDefault();stepWait.res();return}
  const t=e.target;if(t.closest&&t.closest('input,textarea,select,button,label'))return;
  if(!$('#ov-reto').hidden||!$('#ov-win').hidden||!$('#ov-player').hidden)return;
  if(e.code==='Space'||e.key==='Enter'){e.preventDefault();roll()}
});
document.addEventListener('toggle',e=>{if(e.target&&e.target.id==='adultBox')adultOpen=e.target.open},true);
document.addEventListener('pointerdown',()=>unlockAudio(),{passive:true});
document.addEventListener('touchend',()=>unlockAudio(),{passive:true});
document.addEventListener('keydown',()=>unlockAudio());
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')ensureAudio();musicUpdate();soundBadge();if(document.visibilityState==='visible'&&screen==='game')keepAwake()});
if('speechSynthesis' in window){try{speechSynthesis.getVoices()}catch(e){}}
